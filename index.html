function openPlayerModal(pid) {
  const ut = getUserTeam(), p = ut.roster.find(x => x.id === pid);
  if (!p) return;
  const dc = calcDeadCap(p), ext = Math.round(p.salary * 1.12 * 10) / 10;
  openModal(`#${p.jersey} ${p.name} (${p.pos})`, `
    <div class="grid grid-cols-4 gap-2 text-center text-xs">
      <div class="bg-slate-900 p-2 rounded"><div class="text-slate-400">OVR</div><div class="text-lg font-black text-amber-400">${p.ovr}</div></div>
      <div class="bg-slate-900 p-2 rounded"><div class="text-slate-400">POT</div><div class="text-lg font-black text-sky-400">${p.pot}</div></div>
      <div class="bg-slate-900 p-2 rounded"><div class="text-slate-400">연봉</div><div class="text-sm font-black text-emerald-400 mt-1">$${p.salary}M/${p.years}y</div></div>
      <div class="bg-slate-900 p-2 rounded"><div class="text-slate-400">데드캡</div><div class="text-sm font-black text-rose-400 mt-1">$${dc}M</div></div>
    </div>
    ${p.pos === 'QB' ? `<div class="text-xs bg-slate-900/80 p-2.5 rounded border border-slate-800 flex justify-between"><span class="text-slate-400">공식 NFL 패서 레이팅 (Passer Rating)</span><strong class="font-mono-num text-amber-400">${calcPasserRating(p.stats)} / 158.3</strong></div>` : ''}
    <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-800">
      <button onclick="promotePlayer(${p.id})" class="px-3 py-1.5 rounded bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold">⬆️ 주전 1순위</button>
      <button onclick="extendPlayer(${p.id},${ext})" class="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">✍️ 3년 연장 ($${ext}M)</button>
      ${!p.restructured && p.salary >= 4 ? `<button onclick="restructureContract(${p.id})" class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">💼 계약 재조정 (캡 +$${(p.salary*0.35).toFixed(1)}M)</button>` : ''}
      ${p.years === 1 && !ut.franchiseTagUsed ? `<button onclick="applyFranchiseTag(${p.id})" class="px-3 py-1.5 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold">🏷️ 프랜차이즈 태그</button>` : ''}
      <button onclick="releasePlayer(${p.id})" class="px-3 py-1.5 rounded bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold">✂️ 방출</button>
    </div>`);
}
function promotePlayer(pid) {
  const ut = getUserTeam(), i = ut.roster.findIndex(p=>p.id===pid); if (i<0) return;
  const [p] = ut.roster.splice(i,1); const fi = ut.roster.findIndex(x=>x.pos===p.pos);
  ut.roster.splice(fi<0?0:fi, 0, p); closeModal(); showToast(`${p.name} 주전 승격!`, 'success'); renderApp();
}
function extendPlayer(pid, sal) {
  const ut = getUserTeam(), p = ut.roster.find(x=>x.id===pid); if (!p) return;
  if (getTeamCapSpace(ut) < sal - p.salary) { showToast('샐러리캡 부족', 'error'); return; }
  p.salary = sal; p.years += 3; p.guaranteed = Math.round(sal * 1.5 * 10)/10; closeModal(); showToast(`${p.name} 3년 연장 완료`, 'success'); renderApp();
}
function releasePlayer(pid) {
  const ut = getUserTeam(); if (ut.roster.length <= 35) return;
  const i = ut.roster.findIndex(p=>p.id===pid); if (i<0) return;
  const [p] = ut.roster.splice(i,1); ut.deadCap = Math.round((ut.deadCap + calcDeadCap(p))*10)/10;
  p.guaranteed = 0; p.years = 1; STATE.freeAgents.unshift(p); closeModal(); showToast(`${p.name} 방출 완료`, 'info'); renderApp();
}
function restructureContract(pid) {
  const ut = getUserTeam(), p = ut.roster.find(x => x.id === pid);
  if (!p || p.restructured || p.salary < 4) return;
  const save = Math.round(p.salary * 0.35 * 10) / 10;
  p.salary = Math.round((p.salary - save) * 10) / 10;
  p.guaranteed = Math.round((p.guaranteed + save * 1.4) * 10) / 10;
  p.restructured = true;
  closeModal();
  showToast(`${p.name} 계약 재조정 완료! 올해 캡 +$${save}M 확보 (향후 데드캡 증가)`, 'success');
  renderApp();
}
function applyFranchiseTag(pid) {
  const ut = getUserTeam(), p = ut.roster.find(x => x.id === pid);
  if (!p || ut.franchiseTagUsed || p.years !== 1) return;
  const tagSal = p.pos === 'QB' ? 38.5 : ['WR','DL','CB','OL'].includes(p.pos) ? 22.0 : 14.5;
  const diff = tagSal - p.salary;
  if (getTeamCapSpace(ut) < diff) { showToast('프랜차이즈 태그 적용을 위한 캡 여유가 부족합니다.', 'error'); return; }
  p.salary = tagSal; p.years = 2; p.guaranteed = tagSal; p.franchiseTagged = true; ut.franchiseTagUsed = true;
  closeModal();
  showToast(`🏷️ ${p.name}에게 프랜차이즈 태그 적용 완료 ($${tagSal}M)!`, 'success');
  renderApp();
}
function signFA(pid) {
  const ut = getUserTeam(), i = STATE.freeAgents.findIndex(p=>p.id===pid); if (i<0) return;
  const p = STATE.freeAgents[i];
  if (getTeamCapSpace(ut) < p.salary) { showToast('샐러리캡 부족', 'error'); return; }
  STATE.freeAgents.splice(i,1); ut.roster.push(p); sortDepthChart(ut); showToast(`${p.name} FA 영입 완료`, 'success'); renderApp();
}
function toggleTradeAsset(side, type, id) {
  const arr = side==='user' ? TRADE_USER_ASSETS : TRADE_AI_ASSETS;
  const i = arr.findIndex(a=>a.type===type && a.id===id);
  if (i>=0) arr.splice(i,1); else arr.push({type,id}); renderApp();
}
function executeTrade() {
  const ut = getUserTeam(), partner = getTeam(TRADE_PARTNER_ID);
  const mv = (arr, f, t) => arr.forEach(a => {
    if (a.type==='pick') { const i=f.picks.findIndex(x=>x.id===a.id); if(i>=0) t.picks.push(f.picks.splice(i,1)[0]); }
    else { const i=f.roster.findIndex(x=>x.id===a.id); if(i>=0) t.roster.push(f.roster.splice(i,1)[0]); }
  });
  mv(TRADE_USER_ASSETS, ut, partner); mv(TRADE_AI_ASSETS, partner, ut);
  sortDepthChart(ut); sortDepthChart(partner); TRADE_USER_ASSETS=[]; TRADE_AI_ASSETS=[];
  showToast('트레이드 성사!', 'success'); renderApp();
}


const SLOT_PREFIX = 'gridiron_manager_26_slot_';
const MEMORY_SLOTS = {};

function readSlotRaw(slotNum) {
  try {
    const ls = localStorage.getItem(SLOT_PREFIX + slotNum);
    if (ls) return ls;
  } catch (e) {}
  return MEMORY_SLOTS[slotNum] || null;
}

function getSlotMeta(slotNum) {
  try {
    const raw = readSlotRaw(slotNum);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    return obj.meta || null;
  } catch (e) { return null; }
}

function saveToSlot(slotNum) {
  if (!STATE) return;
  const ut = getUserTeam();
  const now = new Date();
  const ts = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const payload = {
    meta: { team: `${ut.city} ${ut.name}`, teamId: ut.id, coach: STATE.coachName, season: STATE.season, week: STATE.week, record: `${ut.w}-${ut.l}`, savedAt: ts },
    state: STATE
  };
  const serialized = JSON.stringify(payload);
  MEMORY_SLOTS[slotNum] = serialized;
  let persisted = false;
  try {
    localStorage.setItem(SLOT_PREFIX + slotNum, serialized);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    persisted = true;
  } catch (e) {}
  showToast(persisted ? `슬롯 ${slotNum}에 저장 완료! (${ts})` : `슬롯 ${slotNum} 임시 저장 완료 (영구 보관은 파일 다운로드 이용)`, 'success');
  openSaveLoadModal();
}

function loadFromSlot(slotNum) {
  try {
    const raw = readSlotRaw(slotNum);
    if (!raw) { showToast('해당 슬롯에 저장된 데이터가 없습니다.', 'error'); return; }
    const obj = JSON.parse(raw);
    if (!obj || !obj.state || !obj.state.teams) throw new Error();
    stopAutoPlay();
    STATE = obj.state;
    LIVE_MATCH = null;
    SCREEN = 'OFFICE';
    OFFICE_TAB = 'office';
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {}
    closeModal();
    renderApp();
    showToast(`슬롯 ${slotNum} 불러오기 완료! (${obj.meta.team} · ${obj.meta.season} W${obj.meta.week})`, 'success');
  } catch (e) {
    showToast('저장 파일을 불러오지 못했습니다.', 'error');
  }
}

function deleteSlot(slotNum) {
  delete MEMORY_SLOTS[slotNum];
  try { localStorage.removeItem(SLOT_PREFIX + slotNum); } catch (e) {}
  showToast(`슬롯 ${slotNum} 삭제 완료`, 'info');
  openSaveLoadModal();
}

function downloadSaveFile() {
  if (!STATE) return;
  const ut = getUserTeam();
  const blob = new Blob([JSON.stringify(STATE)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `GridironManager26_${ut.id}_S${STATE.season}_W${STATE.week}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('세이브 파일(.json)이 다운로드되었습니다!', 'success');
}

function triggerLoadSaveFile(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const loadedState = parsed.state || parsed;
      if (!loadedState || !loadedState.teams || !loadedState.userTeamId) throw new Error();
      STATE = loadedState;
      LIVE_MATCH = null;
      SCREEN = 'OFFICE';
      OFFICE_TAB = 'office';
      saveToLocalStorage(true);
      closeModal();
      renderApp();
      showToast('세이브 파일 불러오기 성공!', 'success');
    } catch (e) {
      showToast('올바른 Gridiron Manager 세이브 파일이 아닙니다.', 'error');
    }
  };
  reader.readAsText(file);
}

function openSaveLoadModal() {
  const slotsHtml = [1, 2, 3].map(n => {
    const m = getSlotMeta(n);
    return `
      <div class="p-3 rounded-xl bg-slate-900/90 border border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
        <div>
          <div class="text-xs font-extrabold text-amber-400">저장 슬롯 ${n}</div>
          ${m ? `<div class="text-sm font-bold text-white mt-0.5">${m.team} (${m.record})</div>
                 <div class="text-[11px] text-slate-400">감독 ${m.coach} · ${m.season} 시즌 W${m.week} · 저장 ${m.savedAt}</div>`
              : `<div class="text-xs text-slate-500 mt-0.5">비어 있음</div>`}
        </div>
        <div class="flex items-center gap-1.5">
          ${STATE ? `<button onclick="saveToSlot(${n})" class="px-3 py-2 sm:py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold">저장</button>` : ''}
          ${m ? `<button onclick="loadFromSlot(${n})" class="px-3 py-2 sm:py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold">로드</button>` : ''}
          ${m ? `<button onclick="deleteSlot(${n})" class="px-2.5 py-2 sm:py-1.5 rounded-lg bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white text-xs font-bold">삭제</button>` : ''}
        </div>
      </div>`;
  }).join('');

  openModal('💾 새 게임 · 저장 · 불러오기', `
    <div class="space-y-4">
      <div class="flex flex-wrap gap-2">
        <button onclick="openNewCareerScreen();" class="flex-1 py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs sm:text-sm">🆕 새 게임 시작 (32구단 선택)</button>
      </div>
      <div class="space-y-2.5">
        <div class="text-xs font-bold text-slate-300">브라우저 멀티 슬롯 저장소 (자동 저장 별도 유지)</div>
        ${slotsHtml}
      </div>
      <div class="border-t border-slate-800 pt-3 space-y-2">
        <div class="text-xs font-bold text-slate-300">기기 백업 파일 (.json 내보내기 / 불러오기)</div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="downloadSaveFile()" class="py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-sky-300 text-xs font-extrabold">📥 세이브 파일 다운로드</button>
          <label class="py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-emerald-300 text-xs font-extrabold text-center cursor-pointer">
            📤 세이브 파일 열기
            <input type="file" accept=".json,application/json" onchange="triggerLoadSaveFile(this)" class="hidden" />
          </label>
        </div>
      </div>
    </div>`);
}

function saveToLocalStorage(silent = false) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); if (!silent) showToast('저장 완료!', 'success'); } catch (e) {}
}
function loadFromLocalStorage() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) { STATE = JSON.parse(raw); return true; } } catch (e) {}
  return false;
}
function openSettingsModal() {
  openModal('⚙️ 세이브 · 커스텀 로스터 JSON', `
    <div class="space-y-4 text-xs">
      <div class="flex flex-wrap gap-2">
        <button onclick="saveToLocalStorage(false)" class="px-4 py-2 rounded bg-emerald-600 text-white font-bold">💾 수동 저장</button>
        <button onclick="exportRosterJSON()" class="px-4 py-2 rounded bg-sky-600 text-white font-bold">📤 로스터 JSON 복사</button>
        <button onclick="openNewCareerScreen();" class="px-4 py-2 rounded bg-amber-500 text-slate-950 font-extrabold">🆕 새 커리어 (구단 선택)</button>
      </div>
      <div>
        <div class="font-bold text-slate-300 mb-1">📥 커스텀 로스터 JSON 불러오기</div>
        <textarea id="json-import-box" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded p-2 font-mono-num text-[11px] text-slate-200" placeholder='[{"name":"Custom QB","pos":"QB","ovr":95,"age":25,"salary":45.0,"years":4}]'></textarea>
        <button onclick="importRosterJSON()" class="mt-2 px-4 py-1.5 rounded bg-sky-500 text-white font-bold">적용</button>
      </div>
    </div>`);
}
function exportRosterJSON() {
  const data = JSON.stringify(getUserTeam().roster.map(p=>({name:p.name,pos:p.pos,age:p.age,ovr:p.ovr,pot:p.pot,salary:p.salary,years:p.years})), null, 2);
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(data).then(()=>showToast('JSON 복사 완료','success')).catch(()=>{});
}
function importRosterJSON() {
  try {
    const arr = JSON.parse(document.getElementById('json-import-box')?.value || '');
    if (!Array.isArray(arr)) throw new Error();
    const ut = getUserTeam();
    arr.forEach(item => { if (!item.name||!item.pos) return; const np = createPlayer(item.pos,'starter',item.age||25); np.name=item.name; if(item.ovr) np.ovr=clamp(item.ovr,50,99); ut.roster.unshift(np); });
    sortDepthChart(ut); closeModal(); showToast(`커스텀 선수 ${arr.length}명 적용!`, 'success'); renderApp();
  } catch (e) { showToast('유효한 JSON 형식이 아닙니다.', 'error'); }
}

// ============================================================================
// 10. BOOTSTRAP
// ============================================================================
window.onload = () => {
  if (!loadFromLocalStorage()) {
    createNewFranchise('LAC', 'Cole Harper');
    SCREEN = 'OFFICE';
  }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
  window.addEventListener('resize', () => { if (SCREEN === 'MATCH' && LIVE_MATCH) drawFieldCanvas(); });
  window.addEventListener('keydown', (e) => {
    const lockEl = document.getElementById('pin-lock-screen');
    if (!lockEl || lockEl.classList.contains('hidden')) return;
    if (/^[0-9]$/.test(e.key)) pressPinKey(e.key);
    else if (e.key === 'Backspace') backspacePinKey();
  });
  if (!isPinUnlocked()) {
    const lockEl = document.getElementById('pin-lock-screen');
    if (lockEl) { lockEl.classList.remove('hidden'); lockEl.classList.add('flex'); }
  } else {
    renderApp();
  }
};
