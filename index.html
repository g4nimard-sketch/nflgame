// 🔒 2인 전용 접속 PIN 설정 (원하는 4자리 숫자로 변경하세요! ''로 비우면 잠금 해제)
// ============================================================================
const ACCESS_PIN = '2026';
const PIN_AUTH_KEY = 'gm26_pin_unlocked_v1';
let PIN_BUFFER = '';

function isPinUnlocked() {
  if (!ACCESS_PIN) return true;
  try {
    if (localStorage.getItem(PIN_AUTH_KEY) === ACCESS_PIN) return true;
  } catch (e) {}
  return false;
}

function updatePinDots() {
  const wrap = document.getElementById('pin-dots');
  if (!wrap) return;
  Array.from(wrap.children).forEach((dot, i) => {
    if (i < PIN_BUFFER.length) {
      dot.className = 'w-3.5 h-3.5 rounded-full border-2 border-amber-400 bg-amber-400 transition';
    } else {
      dot.className = 'w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent transition';
    }
  });
}

function pressPinKey(digit) {
  if (PIN_BUFFER.length >= ACCESS_PIN.length) return;
  PIN_BUFFER += String(digit);
  const err = document.getElementById('pin-error');
  if (err) err.textContent = '';
  updatePinDots();
  if (PIN_BUFFER.length === ACCESS_PIN.length) {
    if (PIN_BUFFER === ACCESS_PIN) {
      const rem = document.getElementById('pin-remember');
      if (!rem || rem.checked) {
        try { localStorage.setItem(PIN_AUTH_KEY, ACCESS_PIN); } catch (e) {}
      }
      const lockEl = document.getElementById('pin-lock-screen');
      if (lockEl) { lockEl.classList.add('hidden'); lockEl.classList.remove('flex'); }
      renderApp();
    } else {
      if (err) err.textContent = 'PIN 번호가 일치하지 않습니다.';
      PIN_BUFFER = '';
      updatePinDots();
    }
  }
}

function backspacePinKey() {
  PIN_BUFFER = PIN_BUFFER.slice(0, -1);
  updatePinDots();
}

function clearPinInput() {
  PIN_BUFFER = '';
  const err = document.getElementById('pin-error');
  if (err) err.textContent = '';
  updatePinDots();
}

function renderTeamCrest(team, size = 40) {
  const s = size, ac = team.accent || '#facc15';
  let glyph = '';
  if (team.icon === 'bolt') glyph = `<path d="M11,22 Q18,12 29,14 Q23,18 25,20 Q17,22 12,28 Q16,22 11,22 Z" fill="${ac}" stroke="#fff" stroke-width="0.9"/>`;
  else if (team.icon === 'arrow') glyph = `<path d="M10,20 L26,11 L24,20 L26,29 Z" fill="#fff" stroke="${ac}" stroke-width="1.6"/>`;
  else if (team.icon === 'shoe') glyph = `<path d="M13,12 V22 A7,7 0 0,0 27,22 V12" fill="none" stroke="${ac}" stroke-width="3.6" stroke-linecap="round"/>`;
  else if (team.icon === 'horn') glyph = `<path d="M12,24 C10,14 22,10 28,18 C25,17 20,18 19,24" fill="none" stroke="${ac}" stroke-width="3.5" stroke-linecap="round"/>`;
  else if (team.icon === 'triad') glyph = `<polygon points="20,9 23,14 20,19 17,14" fill="#facc15"/><polygon points="26,17 29,22 26,27 23,22" fill="#ef4444"/><polygon points="14,17 17,22 14,27 11,22" fill="#38bdf8"/>`;
  else if (team.icon === 'bull') glyph = `<path d="M10,13 Q14,19 20,18 Q26,19 30,13 L26,25 L20,29 L14,25 Z" fill="${ac}" stroke="#fff" stroke-width="1"/>`;
  else if (team.icon === 'bison') glyph = `<path d="M10,22 Q14,13 24,14 L30,20 L25,25 L12,25 Z" fill="#fff"/><path d="M12,20 L28,17" stroke="${ac}" stroke-width="2.6"/>`;

function renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5 ? 1 : 0;
  let out = '';
  for (let i = 0; i < 5; i++) {
    if (i < full) out += '<span class="text-amber-400">★</span>';
    else if (i === full && half) out += '<span class="text-amber-300/75">★</span>';
    else out += '<span class="text-slate-600">★</span>';
  }
  return out;
}

// Web Audio API SFX
const SoundFX = {
  ctx: null, enabled: true,
  init() {
    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'sine', vol = 0.07, delay = 0) {
    if (!this.enabled) return;
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + dur);
  },
  snap() { this.tone(135, 0.07, 'triangle', 0.09); },
  whistle() { this.tone(2650, 0.13, 'sine', 0.045, 0); this.tone(2790, 0.15, 'sine', 0.045, 0.08); },
  firstDown() { this.tone(523, 0.1, 'triangle', 0.06, 0); this.tone(659, 0.15, 'triangle', 0.06, 0.09); },
  touchdown() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.22, 'sawtooth', 0.045, i * 0.09)); },
  turnover() { this.tone(240, 0.18, 'sawtooth', 0.06, 0); this.tone(170, 0.28, 'sawtooth', 0.06, 0.15); }
};

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function gaussian(mean, std) {
  let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random();
  return mean + std * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}
function fmtClock(sec) { const s = Math.max(0, Math.floor(sec)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function ovrClass(ovr) { return ovr >= 85 ? 'ovr-elite' : ovr >= 78 ? 'ovr-good' : ovr >= 70 ? 'ovr-avg' : 'ovr-low'; }
function ordinal(n) { return n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : '4th'; }
function fmtYardLine(yl, offAbbr, defAbbr) { return yl === 50 ? '50 YD' : yl < 50 ? `${offAbbr} ${yl}` : `${defAbbr} ${100 - yl}`; }
function emptyStats() { return { passAtt:0, passCmp:0, passYds:0, passTD:0, ints:0, rushAtt:0, rushYds:0, rushTD:0, rec:0, recYds:0, recTD:0, tackles:0, sacks:0, defInt:0, fgAtt:0, fgMade:0 }; }
function calcPasserRating(st) {
  if (!st || !st.passAtt) return '0.0';
  const a = clamp(((st.passCmp / st.passAtt) - 0.3) * 5, 0, 2.375);
  const b = clamp(((st.passYds / st.passAtt) - 3) * 0.25, 0, 2.375);
  const c = clamp((st.passTD / st.passAtt) * 20, 0, 2.375);
  const d = clamp(2.375 - ((st.ints / st.passAtt) * 25), 0, 2.375);
  return (((a + b + c + d) / 6) * 100).toFixed(1);
}
function generateStaffMember(role) {
  const specs = { OC: ['Air Raid Guru','Run Game Architect','West Coast Mind','QB Whisperer'], DC: ['Blitz Mastermind','Zone Lock Specialist','Front-7 Strategist','Ball-Hawk Coach'], SCOUT: ['Draft Diamond Finder','Combine Analyst','College Pipeline'], TRAINER: ['Rehab Specialist','Sports Science','Injury Prevention'] };
  const stars = clamp(Math.round((2.5 + Math.random() * 2.5) * 2) / 2, 2.5, 5.0);
  return {

    stars, spec: specs[role][rand(0, specs[role].length - 1)],
    bonus: Math.round((stars - 2.0) * 1.4 * 10) / 10
  };
}

let GLOBAL_PID = 1000;
function createPlayer(pos, tier = 'starter', ageOverride = null) {
  const baseMean = tier === 'star' ? 87 : tier === 'starter' ? 78 : tier === 'backup' ? 70 : tier === 'rookie_top' ? 79 : tier === 'rookie_mid' ? 72 : 65;
  const ovr = clamp(Math.round(gaussian(baseMean, 4.2)), 58, 97);
  const age = ageOverride || rand(21, 33);
  const pot = clamp(ovr + (age <= 23 ? rand(5, 14) : age <= 26 ? rand(1, 6) : 0), ovr, 99);
  const salaryBase = pos === 'QB' ? 1.65 : ['WR','DL','CB','OL'].includes(pos) ? 1.15 : ['K','P','LS'].includes(pos) ? 0.35 : 0.9;
  const salary = Math.round(Math.max(0.9, Math.pow(Math.max(1, ovr - 60) / 10, 2.05) * 2.05 * salaryBase) * 10) / 10;
  const years = rand(1, 4);
  const guaranteed = Math.round(salary * years * (ovr >= 80 ? 0.5 : 0.25) * 10) / 10;
  const numRanges = { QB:[1,19], RB:[20,39], WR:[1,19], TE:[80,89], OL:[50,79], DL:[90,99], LB:[40,59], CB:[20,39], S:[20,45], K:[1,19], P:[1,19], LS:[45,59] };
  const [nLo, nHi] = numRanges[pos] || [1, 99];
  const traits = TRAITS[pos] || ['Balanced'];
  return {
    id: GLOBAL_PID++,
    jersey: rand(nLo, nHi),
    name: `${FIRST_NAMES[rand(0, FIRST_NAMES.length - 1)]} ${LAST_NAMES[rand(0, LAST_NAMES.length - 1)]}`,
    pos, age, ovr, pot,
    trait: traits[rand(0, traits.length - 1)],
    attrs: { spd: clamp(ovr+rand(-7,7),50,99), str: clamp(ovr+rand(-7,7),50,99), awr: clamp(ovr+rand(-6,7),50,99), skl: clamp(ovr+rand(-5,7),50,99) },
    salary, years, guaranteed, morale: rand(72, 96), injuredWeeks: 0, peakOvr: ovr, seasonsPlayed: 0, restructured: false, franchiseTagged: false, stats: emptyStats(), careerStats: emptyStats()
  };
}

function calcDeadCap(p) { return Math.round((p.guaranteed * 0.45) * 10) / 10; }
function getTeamCapUsed(t) { return Math.round((t.roster.reduce((s, p) => s + p.salary, 0) + t.deadCap) * 10) / 10; }
function getTeamCapSpace(t) { return Math.round((getSalaryCap() - getTeamCapUsed(t)) * 10) / 10; }
function sortDepthChart(team) {
  const order = ['QB','RB','WR','TE','OL','DL','LB','CB','S','K','P','LS'];
  team.roster.sort((a, b) => (order.indexOf(a.pos) - order.indexOf(b.pos)) || (b.ovr - a.ovr));
}
function getTeamRatings(team) {
  const best = (pos, n = 1) => {
    const arr = team.roster.filter(p => p.pos === pos && p.injuredWeeks === 0);
    if (!arr.length) return 60;
    const sl = arr.slice(0, n);
    return sl.reduce((s, p) => s + p.ovr, 0) / sl.length;
  };
  const passOff = best('QB',1)*0.45 + best('WR',3)*0.3 + best('TE',1)*0.1 + best('OL',5)*0.15;
  const rushOff = best('RB',1)*0.45 + best('OL',5)*0.45 + best('TE',1)*0.1;
  const passDef = best('CB',2)*0.35 + best('S',2)*0.25 + best('DL',4)*0.25 + best('LB',2)*0.15;
  const rushDef = best('DL',4)*0.45 + best('LB',3)*0.35 + best('S',2)*0.2;
  const kicker = best('K',1);
  const ocB = (team.staff && team.staff.OC) ? team.staff.OC.bonus * 0.65 : 0;
  const dcB = (team.staff && team.staff.DC) ? team.staff.DC.bonus * 0.65 : 0;
  const off = clamp(Math.round((passOff + rushOff) / 2 + ocB), 55, 99);
  const def = clamp(Math.round((passDef + rushDef) / 2 + dcB), 55, 99);
  return { passOff, rushOff, passDef, rushDef, kicker, off, def, ovr: Math.round((off + def) / 2) };
}

function generateSchedule(teams) {
  const schedule = Array.from({ length: 18 }, () => []);
  const ids = teams.map(t => t.id);
  const byeMap = {};
  ids.forEach((id, idx) => { byeMap[id] = 5 + (idx % 10); });
  for (let w = 1; w <= 18; w++) {
    const pool = ids.filter(id => byeMap[id] !== w).sort(() => Math.random() - 0.5);
    while (pool.length >= 2) schedule[w - 1].push({ week: w, home: pool.pop(), away: pool.pop(), played: false, homeScore: 0, awayScore: 0 });
  }
  return schedule;
}

function generateDraftClass() {
  const positions = ['QB','RB','WR','WR','TE','OL','OL','DL','DL','LB','CB','CB','S','K'];
  const rookies = [];
  for (let i = 0; i < 120; i++) {
    const p = createPlayer(positions[rand(0, positions.length - 1)], i < 24 ? 'rookie_top' : i < 70 ? 'rookie_mid' : 'backup', rand(21, 23));
    p.salary = i < 15 ? 6.5 : i < 32 ? 3.8 : i < 64 ? 1.8 : 1.0; p.years = 4; p.guaranteed = Math.round(p.salary * 2.2 * 10) / 10;

  }
  return rookies.sort((a, b) => (b.ovr + b.pot * 0.4) - (a.ovr + a.pot * 0.4));
}

function generateFreeAgents() {
  const positions = ['QB','RB','WR','TE','OL','DL','LB','CB','S','K','P'];

}

            const tier = i === 0 ? (Math.random() < (t.stars >= 4.5 ? 0.35 : 0.18) ? 'star' : 'starter') : (i === 1 && ['WR','OL','DL','LB','CB','S'].includes(pos) ? 'starter' : 'backup');
            roster.push(createPlayer(pos, tier));
          }
        }
      }
      const totalSal = roster.reduce((s, p) => s + p.salary, 0);
      if (totalSal > 282) {
        const scale = 264 / totalSal;
        roster.forEach(p => { p.salary = Math.max(0.8, Math.round(p.salary * scale * 10) / 10); });
      }
      const team = {
        ...t, conf: d.conf, div: d.div,
        offScheme: offKeys[rand(0, offKeys.length - 1)],
        defScheme: defKeys[rand(0, defKeys.length - 1)],
        tempo: 'Balanced', fourthDown: 'Balanced', passRatio: 55,
        trainingMode: 'coach', trainOff: 'Blocking', trainDef: 'Pass Rush', trainST: 'Kick Accuracy',
        deadCap: 0, franchiseTagUsed: false, staff: { OC: generateStaffMember('OC'), DC: generateStaffMember('DC'), SCOUT: generateStaffMember('SCOUT'), TRAINER: generateStaffMember('TRAINER') }, roster, w: 0, l: 0, t: 0, pf: 0, pa: 0,
        picks: [1,2,3,4,5,6,7].map(r => ({ id: `${t.id}_R${r}_2026`, round: r, origTeam: t.id, year: 2026 }))
      };
      sortDepthChart(team);
      teams.push(team);
    }
  }
  STATE = {
    season: 2026, week: 1, phase: 'REGULAR',
    coachName, userTeamId, teams,
    schedule: generateSchedule(teams),
    playoffs: null, freeAgents: generateFreeAgents(),
    draftClass: generateDraftClass(), draftOrder: [], draftPickIdx: 0,
    salaryCap: BASE_SALARY_CAP_2026, watchlist: [], inbox: [], champions: [], awardsHistory: [], hallOfFame: [], staffMarket: ['OC','DC','SCOUT','TRAINER','OC','DC','SCOUT','TRAINER'].map(r => generateStaffMember(r))
  };
  TRADE_PARTNER_ID = teams.find(t => t.id !== userTeamId).id;
  addInbox('단장·헤드코치 부임 브리핑', '구단주 오피스',
    `${coachName} 감독님, ${getUserTeam().city} ${getUserTeam().name} 지휘봉을 잡으신 것을 환영합니다. 현재 53인 로스터와 $${getSalaryCap().toFixed(1)}M 샐러리캡이 배정되었습니다. 우측 상단 'Continue →' 또는 'Go to Game Day'로 1주차 경기를 시작하세요.`, 'Club');
  addInbox('주간 스카우트 리포트 — 드래프트 핵심 타깃', '수석 스카우트 Alex Morgan',
    `현재 로스터 취약 포지션을 점검한 결과, 다가올 드래프트 최상위 유망주로 ${STATE.draftClass[0].name}(${STATE.draftClass[0].pos}, 예상 OVR ${STATE.draftClass[0].ovr}), ${STATE.draftClass[1].name}(${STATE.draftClass[1].pos}), ${STATE.draftClass[2].name}(${STATE.draftClass[2].pos})을 추천합니다.`, 'Scouts');
  generatePreGameBriefing();
  SELECTED_INBOX_ID = STATE.inbox[0]?.id || null;
  LIVE_MATCH = null;
}

// ============================================================================
// 5. CALIBRATED NFL MATCH SIMULATION ENGINE
// ============================================================================
function getKeyPlayers(team) {
  const pick = (pos, idx = 0) => team.roster.filter(p => p.pos === pos && p.injuredWeeks === 0)[idx] || team.roster.find(p => p.pos === pos) || team.roster[0];
  return { qb: pick('QB',0), rb: pick('RB',0), wrs: [pick('WR',0), pick('WR',1), pick('TE',0)], dl: pick('DL',0), lb: pick('LB',0), db: pick('CB',0), k: pick('K',0) };
}

function chooseAIOffPlay(team, down, dist, yardLine, secLeft, scoreDiff) {
  const sc = OFF_SCHEMES[team.offScheme] || OFF_SCHEMES['West Coast'];
  let passBias = team.id === STATE.userTeamId ? (team.passRatio / 100) : sc.passBias;
  let isPass = Math.random() < passBias;
  if (down === 3 && dist >= 6) isPass = Math.random() < 0.86;
  if (down === 3 && dist <= 2) isPass = Math.random() < 0.35;
  if (secLeft < 120 && scoreDiff < 0) isPass = true;
  if (secLeft < 240 && scoreDiff > 7) isPass = false;
  if (!isPass) return Math.random() < 0.55 ? 'Inside Run' : 'Outside Zone';
  const r = Math.random();
  if (dist >= 12 || (secLeft < 60 && scoreDiff < 0)) return r < 0.45 ? 'Deep Shot' : 'Play Action';
  return r < 0.38 ? 'Quick Slant' : r < 0.62 ? 'Play Action' : r < 0.80 ? 'Screen Pass' : 'Deep Shot';
}

function chooseAIDefPlay(team, down, dist, yardLine, secLeft, scoreDiff) {
  if (secLeft < 45 && scoreDiff > 3 && yardLine < 60) return 'Prevent';
  if (down === 3 && dist >= 8) return Math.random() < 0.45 ? 'Zone Blitz' : 'Zone Coverage';
  if (dist <= 2) return Math.random() < 0.6 ? 'Run Stuff' : 'Man Press';
  const s = team.defScheme, r = Math.random();
  if (s === '3-4 Blitz') return r < 0.38 ? 'Zone Blitz' : r < 0.7 ? 'Man Press' : 'Run Stuff';
  if (s === 'Cover 2') return r < 0.55 ? 'Zone Coverage' : r < 0.8 ? 'Run Stuff' : 'Zone Blitz';
  if (s === 'Nickel Man') return r < 0.5 ? 'Man Press' : r < 0.8 ? 'Zone Coverage' : 'Zone Blitz';
  return r < 0.3 ? 'Run Stuff' : r < 0.65 ? 'Zone Coverage' : r < 0.85 ? 'Man Press' : 'Zone Blitz';
}

function getRecommendedPlays(m, isUserOff) {
  if (isUserOff) {
    if (m.down === 4) {
      const fgDist = (100 - m.yardLine) + 17;
      return fgDist <= 56 ? ['Field Goal', 'HB Dive', 'Slants'] : ['Punt', 'Slants', 'Mesh'];
    }
    if (m.dist <= 2) return ['HB Dive', 'HB Stretch', 'Slants'];
    if (m.dist >= 9) return ['Four Verticals', 'PA Boot Over', 'Mesh'];
    return ['Slants', 'Mesh', 'Stick'];
  } else {
    if (m.dist <= 2) return ['4-3 Run Blitz', 'Cover 1 Robber', 'Cover 3 Sky'];
    if (m.dist >= 10) return ['Cover 4 Quarters', 'Cover 2 Tampa 2', 'Mid Blitz 0'];
    return ['Cover 3 Sky', 'Cover 2 Tampa 2', 'Edge Fire Zone 3'];
  }
}

function initLiveMatch(gameObj) {

}

function resolvePlay(m, userCall = null, silent = false) {
  if (m.finished) return;
  const home = getTeam(m.homeId), away = getTeam(m.awayId);
  const offIdx = m.poss, defIdx = 1 - m.poss;
  const offTeam = offIdx === 0 ? home : away, defTeam = defIdx === 0 ? home : away;
  const oR = getTeamRatings(offTeam), dR = getTeamRatings(defTeam);
  const oP = getKeyPlayers(offTeam), dP = getKeyPlayers(defTeam);
  const oScheme = OFF_SCHEMES[offTeam.offScheme] || OFF_SCHEMES['West Coast'];
  const dScheme = DEF_SCHEMES[defTeam.defScheme] || DEF_SCHEMES['4-3 Base'];
  const box = m.box[offIdx];
  const scoreDiff = m.score[offIdx] - m.score[defIdx];
  const totalSecLeft = (4 - Math.min(4, m.qtr)) * 900 + m.clock;
  const prevYL = m.yardLine;

  const logPlay = (text, type = 'normal') => {
    m.lastBanner = text;
    if (!silent) m.log.unshift({ qtr: m.qtr, clock: fmtClock(m.clock), text, type });
  };
  const kickoffTo = (recvIdx) => {
    if (m.qtr >= 5) {
      m.otPossessions[offIdx]++;
      if (m.otPossessions[0] >= 1 && m.otPossessions[1] >= 1 && m.score[0] !== m.score[1]) { finishMatch(m, silent); return; }
    }
    m.poss = recvIdx; m.yardLine = Math.random() < 0.65 ? 30 : clamp(rand(19, 39), 14, 48); m.down = 1; m.dist = 10;
  };

  if (m.awaitingPAT) {
    const choice = userCall || ((m.qtr >= 4 && Math.abs(scoreDiff) === 2) ? 'PAT2' : 'PAT1');
    if (choice === 'PAT2') {
      if (Math.random() < clamp(0.47 + (oR.off - dR.def) * 0.006, 0.25, 0.72)) { m.score[offIdx] += 2; logPlay(`🔥 2점 컨버전 성공! ${offTeam.id} +2점!`, 'td'); if (!silent) SoundFX.firstDown(); }
      else logPlay(`❌ 2점 컨버전 실패!`, 'turnover');
    } else {
      oP.k.stats.fgAtt++;
      if (Math.random() < clamp(0.94 + (oR.kicker - 75) * 0.002, 0.85, 0.99)) { oP.k.stats.fgMade++; m.score[offIdx] += 1; logPlay(`✅ ${oP.k.name} PAT 성공 (+1점)`, 'score'); }
      else logPlay(`❌ ${oP.k.name} PAT 실축!`, 'turnover');
    }
    m.awaitingPAT = false; kickoffTo(defIdx);
    syncSelectedPlayForPossession(m);
    return;
  }

  let action = userCall;
  if (action === 'Field Goal') action = 'FG';
  if (action === 'Punt') action = 'PUNT';
  if (!action && m.down === 4) {
    const fgDist = (100 - m.yardLine) + 17;
    const agg = offTeam.fourthDown === 'Analytics' ? 1 : offTeam.fourthDown === 'Conservative' ? -1 : 0;
    const goForIt = (m.dist <= (2 + agg) && m.yardLine >= (54 - agg * 6) && m.yardLine <= 98) || (m.qtr >= 4 && m.clock < 240 && scoreDiff < 0 && (scoreDiff < -3 || fgDist > 56));
    if (!goForIt) action = fgDist <= 57 ? 'FG' : 'PUNT';
  }

  if (action === 'FG') {
    m.lastOffPlay = 'Field Goal'; m.lastDefPlay = 'FG Block'; m.lastOffEngineKey = 'FG'; m.lastDefEngineKey = 'Zone Coverage'; m.lastOffTeamId = offTeam.id; m.lastDefTeamId = defTeam.id; m.lastFirstDownX = Math.min(100, prevYL + m.dist);
    const fgDist = (100 - m.yardLine) + 17;
    const baseProb = fgDist <= 35 ? 0.96 : fgDist <= 45 ? 0.85 : fgDist <= 52 ? 0.72 : fgDist <= 58 ? 0.54 : 0.30;
    oP.k.stats.fgAtt++; m.clock = Math.max(0, m.clock - 6);
    if (Math.random() < clamp(baseProb + (oR.kicker - 75) * 0.004, 0.15, 0.99)) {
      oP.k.stats.fgMade++; m.score[offIdx] += 3;
      logPlay(`🎯 ${oP.k.name}, ${fgDist}야드 필드골 성공! (+3점)`, 'score');
      if (!silent) { SoundFX.touchdown(); startFieldAnim(prevYL, 100, 'fg', `${fgDist}YD FG GOOD!`, '#10b981'); }
      kickoffTo(defIdx);
    } else {
      logPlay(`❌ ${oP.k.name}, ${fgDist}야드 필드골 실축! 공격권 전환.`, 'turnover');
      if (!silent) { SoundFX.turnover(); startFieldAnim(prevYL, 100, 'fg', 'FG MISSED', '#ef4444'); }
      m.poss = defIdx; m.yardLine = clamp(100 - Math.max(20, m.yardLine - 7), 20, 80); m.down = 1; m.dist = 10;
    }
    advanceClockChecks(m, silent); syncSelectedPlayForPossession(m); return;
  }

  if (action === 'PUNT') {
    m.lastOffPlay = 'Punt'; m.lastDefPlay = 'Punt Return'; m.lastOffEngineKey = 'PUNT'; m.lastDefEngineKey = 'Zone Coverage'; m.lastOffTeamId = offTeam.id; m.lastDefTeamId = defTeam.id; m.lastFirstDownX = Math.min(100, prevYL + m.dist);
    const puntYds = rand(38, 53), landing = m.yardLine + puntYds;
    m.clock = Math.max(0, m.clock - 8);
    if (landing >= 100) { logPlay(`🦶 ${puntYds}야드 펀트 — 터치백 (${defTeam.id} 20야드라인)`, 'info'); m.poss = defIdx; m.yardLine = 20; }
    else { const ret = rand(0, 11), newYL = clamp(100 - landing + ret, 4, 85); logPlay(`🦶 ${puntYds}야드 펀트 (리턴 ${ret}yd) → ${defTeam.id} ${newYL}야드라인`, 'info'); m.poss = defIdx; m.yardLine = newYL; }
    m.down = 1; m.dist = 10;
    if (!silent) { SoundFX.whistle(); startFieldAnim(prevYL, Math.min(98, prevYL + puntYds), 'punt', `PUNT ${puntYds} YDS`, '#94a3b8'); }
    advanceClockChecks(m, silent); syncSelectedPlayForPossession(m); return;
  }

  const isUserOff = offTeam.id === STATE.userTeamId;
  const userOffObj = isUserOff && action ? OFF_PLAYS.find(p => p.id === action) : null;
  const userDefObj = !isUserOff && action ? DEF_PLAYS.find(p => p.id === action) : null;
  const aiOffKey = chooseAIOffPlay(offTeam, m.down, m.dist, m.yardLine, totalSecLeft, scoreDiff);
  const aiDefKey = chooseAIDefPlay(defTeam, m.down, m.dist, m.yardLine, totalSecLeft, scoreDiff);
  const offObj = userOffObj || OFF_PLAYS.find(p => p.engineKey === aiOffKey) || OFF_PLAYS[0];
  const defObj = userDefObj || DEF_PLAYS.find(p => p.engineKey === aiDefKey) || DEF_PLAYS[0];
  const offPlay = offObj.engineKey, defPlay = defObj.engineKey;

  const trainOffBoost = offTeam.id === STATE.userTeamId ? 0.35 : 0;
  const trainDefBoost = defTeam.id === STATE.userTeamId ? 0.35 : 0;
  const matBonus = (PLAY_MATRIX[offPlay][defPlay] || 0) + (offObj.ydsMod || 0) + trainOffBoost - trainDefBoost;

  m.lastOffPlay = `${offObj.id} (${offObj.formation})`;
  m.lastDefPlay = `${defObj.id} (${defObj.formation})`;
  m.lastOffEngineKey = offPlay; m.lastDefEngineKey = defPlay;
  m.lastOffTeamId = offTeam.id; m.lastDefTeamId = defTeam.id; m.lastFirstDownX = Math.min(100, prevYL + m.dist);
  const isPass = !['Inside Run', 'Outside Zone'].includes(offPlay);
  box.plays++;
  if (!silent) SoundFX.snap();

  if (Math.random() < 0.05) {
    const pen = Math.random();
    if (pen < 0.42) {
      const loss = pen < 0.22 ? 5 : 10;
      m.yardLine = Math.max(1, m.yardLine - loss); m.dist += loss; m.clock = Math.max(0, m.clock - 6);
      logPlay(`🚩 페널티! ${offTeam.id} ${loss===5?'False Start':'Offensive Holding'} (-${loss}yd)`, 'penalty');
    } else if (pen < 0.76) {
      m.yardLine = Math.min(99, m.yardLine + 5); m.dist = Math.max(1, m.dist - 5); m.clock = Math.max(0, m.clock - 6);
      logPlay(`🚩 페널티! ${defTeam.id} Offsides (+5yd)`, 'penalty');
    } else {
      const gain = rand(10, 22);
      m.yardLine = Math.min(99, m.yardLine + gain); m.down = 1; m.dist = Math.min(10, 100 - m.yardLine); box.firstDowns++; m.clock = Math.max(0, m.clock - 8);
      logPlay(`🚩 페널티! ${defTeam.id} Pass Interference (+${gain}yd, 자동 1st Down!)`, 'penalty');
    }
    if (!silent) { SoundFX.whistle(); startFieldAnim(prevYL, m.yardLine, 'penalty', 'FLAG ON THE PLAY', '#eab308'); }
    advanceClockChecks(m, silent); return;
  }

  let yards = 0;
  let clockRun = offTeam.tempo === 'Chew Clock' ? rand(38, 46) : offTeam.tempo === 'Hurry-Up' ? rand(14, 22) : rand(30, 40);
  if (totalSecLeft < 140 && scoreDiff < 0) clockRun = rand(10, 18);

  if (isPass) {
    const sackProb = clamp(0.055 + dScheme.sackMod + (dR.passDef - oR.passOff)*0.002 + (defPlay==='Zone Blitz'?0.032:0) + (offPlay==='Deep Shot'?0.025:0), 0.02, 0.17);
    if (Math.random() < sackProb) {
      box.sacks++; dP.dl.stats.sacks++; dP.dl.stats.tackles++;
      yards = -rand(4, 9); m.yardLine += yards; m.dist -= yards; m.down++;
      logPlay(`💥 SACK! ${dP.dl.name}가 ${oP.qb.name}를 ${Math.abs(yards)}야드 뒤에서 색! (${offObj.id} vs ${defObj.id})`, 'turnover');
      if (!silent) { SoundFX.turnover(); startFieldAnim(prevYL, m.yardLine, 'sack', `SACK ${yards} YDS`, '#ef4444'); }
    } else {
      box.passAtt++; oP.qb.stats.passAtt++;
      const baseCmp = offPlay==='Screen Pass'?0.73:offPlay==='Quick Slant'?0.67:offPlay==='Play Action'?0.60:0.42;
      const cmpProb = clamp(baseCmp + oScheme.passCmpMod + (oR.passOff - dR.passDef - dScheme.passDefMod)*0.006 + matBonus*0.02, 0.22, 0.89);
      const intProb = clamp((offPlay==='Deep Shot'?0.044:0.020) + oScheme.intMod + dScheme.intMod + (dR.passDef - oR.passOff)*0.001 - matBonus*0.003, 0.007, 0.085);
      const roll = Math.random();
      if (roll < intProb) {
        box.ints++; oP.qb.stats.ints++; dP.db.stats.defInt++;
        const spot = clamp(100 - Math.min(96, m.yardLine + rand(6, 22)), 5, 92);
        logPlay(`🚨 INTERCEPTION! ${dP.db.name}가 ${oP.qb.name}의 패스를 가로챘습니다! (${offObj.id} vs ${defObj.id})`, 'turnover');
        if (!silent) { SoundFX.turnover(); startFieldAnim(prevYL, 100 - spot, 'int', 'INTERCEPTION!', '#ef4444'); }
        m.poss = defIdx; m.yardLine = spot; m.down = 1; m.dist = 10; m.clock = Math.max(0, m.clock - 10);
        advanceClockChecks(m, silent); syncSelectedPlayForPossession(m); return;
      } else if (roll < intProb + cmpProb) {
        box.passCmp++; oP.qb.stats.passCmp++;
        const target = oP.wrs[rand(0, oP.wrs.length - 1)];
        const meanYds = (offPlay==='Deep Shot'?19.5:offPlay==='Play Action'?12.4:offPlay==='Quick Slant'?7.4:5.8) + oScheme.passYdsMod;
        yards = Math.round(gaussian(meanYds + matBonus*1.25 + (oR.passOff - dR.passDef)*0.12, offPlay==='Deep Shot'?9.5:4.8));
        if (Math.random() < 0.055) yards += rand(9, 24);
        yards = clamp(yards, -2, 100 - m.yardLine);
        box.passYds += yards; oP.qb.stats.passYds += yards; target.stats.rec++; target.stats.recYds += yards; dP.lb.stats.tackles++;
        m.yardLine += yards; m.dist -= yards; m.down++;
        logPlay(`✈️ ${oP.qb.name} → ${target.name} 패스 +${yards}야드 (${offObj.id} vs ${defObj.id})`, yards >= 15 ? 'big' : 'normal');
        if (!silent) startFieldAnim(prevYL, m.yardLine, 'pass', `PASS +${yards} YDS`, '#38bdf8');
      } else {
        clockRun = rand(5, 8); m.down++;
        logPlay(`💨 ${oP.qb.name} 패스 불완전 (Incomplete) — ${offObj.id} vs ${defObj.id}`, 'normal');
        if (!silent) startFieldAnim(prevYL, prevYL, 'inc', 'INCOMPLETE', '#94a3b8');
      }
    }
  } else {
    box.rushAtt++; oP.rb.stats.rushAtt++;
    if (Math.random() < 0.011) {
      box.fumbles++;
      logPlay(`🚨 FUMBLE LOST! ${oP.rb.name} 펌블 → ${defTeam.id} 회복!`, 'turnover');
      if (!silent) { SoundFX.turnover(); startFieldAnim(prevYL, prevYL + 2, 'int', 'FUMBLE LOST!', '#ef4444'); }
      m.poss = defIdx; m.yardLine = clamp(100 - m.yardLine, 5, 95); m.down = 1; m.dist = 10; m.clock = Math.max(0, m.clock - 12);
      advanceClockChecks(m, silent); syncSelectedPlayForPossession(m); return;
    }
    const meanRush = (offPlay==='Inside Run'?3.9:4.1) + oScheme.rushMod - dScheme.rushDefMod*0.4;
    yards = Math.round(gaussian(meanRush + matBonus*0.85 + (oR.rushOff - dR.rushDef)*0.11, 3.1));
    if (Math.random() < 0.05) yards += rand(8, 22);
    yards = clamp(yards, -4, 100 - m.yardLine);
    box.rushYds += yards; oP.rb.stats.rushYds += yards; dP.lb.stats.tackles++;
    m.yardLine += yards; m.dist -= yards; m.down++;
    logPlay(`🏃 ${oP.rb.name} 러싱 ${yards>=0?'+'+yards:yards}야드 (${offObj.id} vs ${defObj.id})`, yards >= 12 ? 'big' : 'normal');
    if (!silent) startFieldAnim(prevYL, m.yardLine, 'rush', `RUSH ${yards>=0?'+':''}${yards} YDS`, '#10b981');
  }

  const prevClock = m.clock;
  m.clock = Math.max(0, m.clock - clockRun);
  if ((m.qtr === 2 || m.qtr === 4) && prevClock > 120 && m.clock <= 120 && !m.twoMinWarned[m.qtr]) {
    m.clock = 120; m.twoMinWarned[m.qtr] = true;
    logPlay(`⏱️ 2-Minute Warning! 시계가 2:00에 멈춥니다.`, 'info');
  }

  if (m.yardLine <= 0) {
    m.score[defIdx] += 2; logPlay(`🚨 SAFETY! ${defTeam.id} +2점!`, 'turnover');
    if (!silent) { SoundFX.turnover(); startFieldAnim(prevYL, 0, 'sack', 'SAFETY! +2', '#ef4444'); }
    kickoffTo(defIdx);
  } else if (m.yardLine >= 100) {
    m.score[offIdx] += 6;
    if (isPass) { oP.qb.stats.passTD++; oP.wrs[0].stats.recTD++; } else { oP.rb.stats.rushTD++; }
    logPlay(`🏈🔥 TOUCHDOWN!! ${offTeam.city} ${offTeam.name} +6점!`, 'td');
    if (!silent) { SoundFX.touchdown(); startFieldAnim(prevYL, 100, 'td', 'TOUCHDOWN!', '#f59e0b'); }
    m.awaitingPAT = true;
    if (silent || !isUserOff) resolvePlay(m, null, silent);
  } else if (m.dist <= 0) {
    box.firstDowns++; m.down = 1; m.dist = Math.min(10, 100 - m.yardLine);
    if (!silent) SoundFX.firstDown();
  } else if (m.down > 4) {
    logPlay(`🔄 4th Down 실패 (Turnover on Downs)! ${defTeam.id} 공격권.`, 'turnover');
    if (!silent) SoundFX.turnover();
    m.poss = defIdx; m.yardLine = clamp(100 - m.yardLine, 1, 99); m.down = 1; m.dist = 10;
  }

  advanceClockChecks(m, silent);
  syncSelectedPlayForPossession(m);
}

function syncSelectedPlayForPossession(m) {
  const isUserOff = (m.poss === 0 ? m.homeId : m.awayId) === STATE.userTeamId;
  const list = isUserOff ? OFF_PLAYS : DEF_PLAYS;
  if (!list.some(p => p.id === MATCH_SELECTED_PLAY)) {
    MATCH_SELECTED_PLAY = getRecommendedPlays(m, isUserOff)[0];
    MATCH_PLAY_CAT = 'ALL';
  }
}

function advanceClockChecks(m, silent) {
  if (m.finished || m.clock > 0) return;
  if (m.qtr === 1) { m.qtr = 2; m.clock = 900; if (!silent) SoundFX.whistle(); }
  else if (m.qtr === 2) { m.qtr = 3; m.clock = 900; m.timeouts = [3, 3]; m.poss = 1 - m.firstHalfRecv; m.yardLine = 30; m.down = 1; m.dist = 10; if (!silent) SoundFX.whistle(); }
  else if (m.qtr === 3) { m.qtr = 4; m.clock = 900; if (!silent) SoundFX.whistle(); }
  else if (m.qtr === 4) {
    if (m.score[0] === m.score[1]) { m.qtr = 5; m.clock = 600; m.timeouts = [2, 2]; m.poss = Math.random()<0.5?0:1; m.yardLine = 30; m.down = 1; m.dist = 10; }
    else finishMatch(m, silent);
  } else {
    if (STATE.phase === 'PLAYOFFS' && m.score[0] === m.score[1]) m.clock = 600;
    else finishMatch(m, silent);
  }
}

function finishMatch(m, silent) {
  if (m.finished) return;
  m.finished = true;
  stopAutoPlay();
  const g = m.gameObj; g.played = true; g.homeScore = m.score[0]; g.awayScore = m.score[1];
  const home = getTeam(m.homeId), away = getTeam(m.awayId);
  if (STATE.phase === 'REGULAR') {
    home.pf += g.homeScore; home.pa += g.awayScore; away.pf += g.awayScore; away.pa += g.homeScore;
    if (g.homeScore > g.awayScore) { home.w++; away.l++; } else if (g.awayScore > g.homeScore) { away.w++; home.l++; } else { home.t++; away.t++; }
  }
  if (!silent) {
    SoundFX.whistle();
    const uWon = (home.id === STATE.userTeamId && g.homeScore > g.awayScore) || (away.id === STATE.userTeamId && g.awayScore > g.homeScore);
    const opp = home.id === STATE.userTeamId ? away : home;
    addInbox(`[경기 결과] ${uWon ? '승리!' : '패배'} vs ${opp.city} ${opp.name} (${g.awayScore}-${g.homeScore})`, '리그 기자단',
      `${away.name} ${g.awayScore} : ${g.homeScore} ${home.name}. 패싱 ${m.box[home.id===STATE.userTeamId?0:1].passYds}야드, 러싱 ${m.box[home.id===STATE.userTeamId?0:1].rushYds}야드를 기록했습니다.`, 'Team News');
  }
}

function simGameSilent(gameObj) {
  if (gameObj.played) return;
  const home = getTeam(gameObj.home), away = getTeam(gameObj.away);
  const firstRecv = Math.random() < 0.5 ? 0 : 1;
  const m = {
    gameObj, homeId: home.id, awayId: away.id, score: [0,0], qtr: 1, clock: 900,
    twoMinWarned: {2:false,4:false}, timeouts: [3,3], poss: firstRecv, firstHalfRecv: firstRecv,
    yardLine: 30, down: 1, dist: 10, awaitingPAT: false, otPossessions: [0,0], finished: false, log: [],
    box: [{ passAtt:0,passCmp:0,passYds:0,rushAtt:0,rushYds:0,sacks:0,ints:0,fumbles:0,firstDowns:0,plays:0 },{ passAtt:0,passCmp:0,passYds:0,rushAtt:0,rushYds:0,sacks:0,ints:0,fumbles:0,firstDowns:0,plays:0 }]
  };
  let guard = 0;
  while (!m.finished && guard < 400) { resolvePlay(m, null, true); guard++; }
  if (!m.finished) finishMatch(m, true);
}

// 6. SEASON PROGRESSION, PLAYOFFS & 7-ROUND DRAFT

function getStandings(conf = null) {
  return STATE.teams.filter(t => !conf || t.conf === conf).sort((a, b) => {
    const wpA = (a.w + a.t*0.5) / Math.max(1, a.w+a.l+a.t), wpB = (b.w + b.t*0.5) / Math.max(1, b.w+b.l+b.t);
    return (wpB - wpA) || ((b.pf - b.pa) - (a.pf - a.pa));
  });
}
function getPlayoffSeeds(conf) {
  const winners = ['East','North','South','West'].map(d => getStandings(conf).filter(t => t.div === d)[0]);
  winners.sort((a,b) => ((b.w+b.t*0.5)/Math.max(1,b.w+b.l+b.t)) - ((a.w+a.t*0.5)/Math.max(1,a.w+a.l+a.t)));
  const wIds = new Set(winners.map(t => t.id));
  return [...winners, ...getStandings(conf).filter(t => !wIds.has(t.id)).slice(0, 3)];
}

function advanceWeekOrPhase() {
  stopAutoPlay();
  STATE.teams.forEach(t => t.roster.forEach(p => { if (p.injuredWeeks > 0) p.injuredWeeks--; }));
  if (STATE.phase === 'REGULAR') {
    STATE.schedule[STATE.week - 1].forEach(g => { if (!g.played) simGameSilent(g); });
    if (Math.random() < 0.12) {
      const victim = getUserTeam().roster[rand(0, 20)];
      if (victim && victim.injuredWeeks === 0) {
        victim.injuredWeeks = rand(1, 2);
        addInbox(`🏥 부상 리포트: ${victim.name} (${victim.pos})`, '메디컬 스태프', `${victim.name} 선수가 경미한 부상으로 ${victim.injuredWeeks}주 결장합니다.`, 'Injuries');
      }
    }
    LIVE_MATCH = null;
    if (STATE.week < 18) { STATE.week++; generatePreGameBriefing(); }
    else {
      STATE.phase = 'PLAYOFFS'; STATE.week = 19;
      const afc = getPlayoffSeeds('AFC'), nfc = getPlayoffSeeds('NFC');
      STATE.playoffs = {
        afcSeeds: afc.map(t=>t.id), nfcSeeds: nfc.map(t=>t.id), currentRound: 0,
        roundNames: ['와일드카드 라운드','디비저널 라운드','컨퍼런스 챔피언십','그리드아이언 볼'],
        rounds: [[
          { conf:'AFC', home:afc[1].id, away:afc[6].id, played:false, homeScore:0, awayScore:0 },
          { conf:'AFC', home:afc[2].id, away:afc[5].id, played:false, homeScore:0, awayScore:0 },
          { conf:'AFC', home:afc[3].id, away:afc[4].id, played:false, homeScore:0, awayScore:0 },
          { conf:'NFC', home:nfc[1].id, away:nfc[6].id, played:false, homeScore:0, awayScore:0 },
          { conf:'NFC', home:nfc[2].id, away:nfc[5].id, played:false, homeScore:0, awayScore:0 },
          { conf:'NFC', home:nfc[3].id, away:nfc[4].id, played:false, homeScore:0, awayScore:0 },
        ],[],[],[]], champion: null
      };
      // Crown Regular Season Awards (MVP / OPOY / DPOY)
      const allLeagueP = STATE.teams.flatMap(t => t.roster.map(p => ({ p, team: t })));
      const mvpC = [...allLeagueP].sort((a,b) => (b.p.stats.passYds*0.04 + b.p.stats.passTD*4 - b.p.stats.ints*2 + b.p.stats.rushYds*0.1 + b.p.stats.rushTD*6 + b.p.stats.recYds*0.1 + b.p.stats.recTD*6) - (a.p.stats.passYds*0.04 + a.p.stats.passTD*4 - a.p.stats.ints*2 + a.p.stats.rushYds*0.1 + a.p.stats.rushTD*6 + a.p.stats.recYds*0.1 + a.p.stats.recTD*6))[0];
      const opoyC = [...allLeagueP].filter(x => x.p.pos !== 'QB').sort((a,b) => (b.p.stats.rushYds + b.p.stats.recYds + (b.p.stats.rushTD + b.p.stats.recTD)*60) - (a.p.stats.rushYds + a.p.stats.recYds + (a.p.stats.rushTD + a.p.stats.recTD)*60))[0];
      const dpoyC = [...allLeagueP].filter(x => ['DL','LB','CB','S'].includes(x.p.pos)).sort((a,b) => (b.p.stats.sacks*5 + b.p.stats.defInt*6 + b.p.stats.tackles*0.5) - (a.p.stats.sacks*5 + a.p.stats.defInt*6 + a.p.stats.tackles*0.5))[0];
      if (!STATE.awardsHistory) STATE.awardsHistory = [];
      STATE.awardsHistory.unshift({
        season: STATE.season,
        mvp: mvpC ? `${mvpC.p.name} (${mvpC.p.pos}, ${mvpC.team.id})` : '-',
        opoy: opoyC ? `${opoyC.p.name} (${opoyC.p.pos}, ${opoyC.team.id})` : '-',
        dpoy: dpoyC ? `${dpoyC.p.name} (${dpoyC.p.pos}, ${dpoyC.team.id})` : '-',
        champ: '진행 중'
      });
      addInbox(`🏆 ${STATE.season} 정규시즌 어워드 및 플레이오프 대진 확정!`, '리그 사무국',
        `정규시즌 MVP: ${mvpC?.p.name}(${mvpC?.team.id}) · OPOY: ${opoyC?.p.name}(${opoyC?.team.id}) · DPOY: ${dpoyC?.p.name}(${dpoyC?.team.id}). 이제 14팀 플레이오프가 개막합니다!`, 'Club');
      generatePreGameBriefing();
    }
  } else if (STATE.phase === 'PLAYOFFS') {
    const po = STATE.playoffs, r = po.currentRound;
    po.rounds[r].forEach(g => { if (!g.played) simGameSilent(g); });
    LIVE_MATCH = null;
    const win = g => g.homeScore >= g.awayScore ? g.home : g.away;
    if (r === 0) {
      const mk = (c, seeds) => { const w = po.rounds[0].filter(g=>g.conf===c).map(win).sort((a,b)=>seeds.indexOf(a)-seeds.indexOf(b)); return [{conf:c,home:seeds[0],away:w[2],played:false,homeScore:0,awayScore:0},{conf:c,home:w[0],away:w[1],played:false,homeScore:0,awayScore:0}]; };
      po.rounds[1] = [...mk('AFC', po.afcSeeds), ...mk('NFC', po.nfcSeeds)]; po.currentRound = 1; STATE.week = 20; generatePreGameBriefing();
    } else if (r === 1) {
      const aw = po.rounds[1].filter(g=>g.conf==='AFC').map(win), nw = po.rounds[1].filter(g=>g.conf==='NFC').map(win);
      po.rounds[2] = [{conf:'AFC',home:aw[0],away:aw[1],played:false,homeScore:0,awayScore:0},{conf:'NFC',home:nw[0],away:nw[1],played:false,homeScore:0,awayScore:0}];
      po.currentRound = 2; STATE.week = 21; generatePreGameBriefing();
    } else if (r === 2) {
      po.rounds[3] = [{conf:'BOWL',home:win(po.rounds[2][0]),away:win(po.rounds[2][1]),played:false,homeScore:0,awayScore:0}];
      po.currentRound = 3; STATE.week = 22; generatePreGameBriefing();
    } else {
      const champ = getTeam(win(po.rounds[3][0]));
      po.champion = champ.id; STATE.champions.push({ season: STATE.season, team: `${champ.city} ${champ.name}` });
      if (STATE.awardsHistory && STATE.awardsHistory[0] && STATE.awardsHistory[0].season === STATE.season) STATE.awardsHistory[0].champ = `${champ.city} ${champ.name}`;
      addInbox(`🏆 ${STATE.season} 챔피언: ${champ.city} ${champ.name}`, '커미셔너', '오프시즌 7라운드 신인 드래프트가 개막합니다!', 'Club');
      STATE.phase = 'DRAFT'; STATE.week = 23;
      const rev = [...getStandings()].reverse(), ord = [];
      for (let rd = 1; rd <= 7; rd++) for (const t of rev) {
        const owner = STATE.teams.find(tm => tm.picks.some(pk => pk.round === rd && pk.origTeam === t.id)) || t;
        ord.push({ round: rd, pickNum: ord.length + 1, teamId: owner.id });
      }
      STATE.draftOrder = ord; STATE.draftPickIdx = 0; STATE.draftClass = generateDraftClass();
      SCREEN = 'OFFICE'; OFFICE_TAB = 'front_office'; GM_SUBTAB = 'draft';
    }
  }
  SCREEN = 'OFFICE';
  saveToLocalStorage(true);
  renderApp();
}

function draftPlayer(rookieId) {
  if (STATE.phase !== 'DRAFT' || STATE.draftPickIdx >= STATE.draftOrder.length) return;
  const cur = STATE.draftOrder[STATE.draftPickIdx], team = getTeam(cur.teamId);
  const idx = STATE.draftClass.findIndex(r => r.id === rookieId);
  if (idx === -1) return;
  const rookie = STATE.draftClass.splice(idx, 1)[0];
  team.roster.push(rookie); sortDepthChart(team); STATE.draftPickIdx++;
  if (team.id === STATE.userTeamId) { showToast(`R${cur.round} #${cur.pickNum} ${rookie.name} (${rookie.pos}) 지명!`, 'success'); SoundFX.firstDown(); }
  if (STATE.draftPickIdx >= STATE.draftOrder.length || !STATE.draftClass.length) finishOffseason();
  renderApp();
}

function simDraft(autoAll = false) {
  while (STATE.draftPickIdx < STATE.draftOrder.length && STATE.draftClass.length) {
    const cur = STATE.draftOrder[STATE.draftPickIdx];
    if (!autoAll && cur.teamId === STATE.userTeamId) break;
    const t = getTeam(cur.teamId); t.roster.push(STATE.draftClass.shift()); sortDepthChart(t); STATE.draftPickIdx++;
  }
  if (STATE.draftPickIdx >= STATE.draftOrder.length || !STATE.draftClass.length) finishOffseason();
  renderApp();
}

function finishOffseason() {
  const prevSeason = STATE.season;
  STATE.season++; STATE.week = 1; STATE.phase = 'REGULAR'; STATE.playoffs = null;
  // Real NFL annual salary cap growth (+$16M/yr)
  STATE.salaryCap = Math.round(((STATE.salaryCap || BASE_SALARY_CAP_2026) + 16.0) * 10) / 10;
  if (!STATE.hallOfFame) STATE.hallOfFame = [];
  const retiredLegends = [];
  const newExpiringFA = [];
  let totalRetired = 0;

  STATE.teams.forEach(t => {
    t.w=0; t.l=0; t.t=0; t.pf=0; t.pa=0; t.deadCap=0; t.franchiseTagUsed=false;
    t.picks = [1,2,3,4,5,6,7].map(r => ({ id: `${t.id}_R${r}_${STATE.season}`, round: r, origTeam: t.id, year: STATE.season }));
    const surviving = [];
    t.roster.forEach(p => {
      // Accumulate career stats
      if (!p.careerStats) p.careerStats = emptyStats();
      Object.keys(p.stats).forEach(k => { p.careerStats[k] = (p.careerStats[k] || 0) + (p.stats[k] || 0); });
      p.seasonsPlayed = (p.seasonsPlayed || 0) + 1;
      p.peakOvr = Math.max(p.peakOvr || p.ovr, p.ovr);
      p.age++; p.years--; p.injuredWeeks = 0; p.restructured = false; p.stats = emptyStats();

      // Position-specific NFL aging curve
      const peakEnd = p.pos === 'RB' ? 25 : (p.pos === 'QB' || p.pos === 'K' || p.pos === 'P') ? 29 : 26;
      const declineStart = p.pos === 'RB' ? 28 : (p.pos === 'QB' || p.pos === 'K' || p.pos === 'P') ? 35 : 30;
      const retireStart = p.pos === 'RB' ? 31 : (p.pos === 'QB' || p.pos === 'K' || p.pos === 'P') ? 37 : 33;

      if (p.age <= peakEnd && p.ovr < p.pot) p.ovr = Math.min(p.pot, p.ovr + rand(1, 3));
      else if (p.age >= declineStart) p.ovr = Math.max(55, p.ovr - rand(1, p.pos === 'RB' ? 4 : 3));

      // Retirement Roll
      const retProb = p.age < retireStart ? 0 : clamp((p.age - retireStart + 1) * 0.22 + (p.ovr < 68 ? 0.25 : 0), 0.15, 0.92);
      if (Math.random() < retProb || p.age >= 42) {
        totalRetired++;
        if ((p.peakOvr >= 86) || (p.careerStats.passYds >= 12000) || (p.careerStats.rushYds >= 4000)) {
          const hofEntry = { name: p.name, pos: p.pos, team: t.id, retiredSeason: prevSeason, peakOvr: p.peakOvr, age: p.age, passYds: p.careerStats.passYds, rushYds: p.careerStats.rushYds, recYds: p.careerStats.recYds, sacks: p.careerStats.sacks };
          STATE.hallOfFame.unshift(hofEntry);
          retiredLegends.push(`${p.name} (${p.pos}, ${t.id})`);
        }
        return; // retired!
      }

      // Contract Expiration -> Free Agency (AI teams re-sign stars ~65% to keep balance; user's expiring non-tagged players enter FA)
      if (p.years <= 0) {
        if (t.id !== STATE.userTeamId && p.ovr >= 76 && Math.random() < 0.65) {
          p.years = rand(2, 4);
          surviving.push(p);
        } else {
          p.years = rand(1, 3); p.guaranteed = Math.round(p.salary * 0.4 * 10) / 10; p.franchiseTagged = false;
          newExpiringFA.push(p);
        }
      } else {
        p.franchiseTagged = false;
        surviving.push(p);
      }
    });
    t.roster = surviving;
    // Ensure AI teams replenish to 53 with generated depth/FA if needed
    while (t.roster.length < 51) {
      const needPos = ['OL','DL','LB','CB','WR','RB','S','TE'][rand(0, 7)];
      t.roster.push(createPlayer(needPos, 'backup', rand(22, 27)));
    }
    sortDepthChart(t);
    if (t.roster.length > 56) t.roster = t.roster.slice(0, 53);
  });

  STATE.schedule = generateSchedule(STATE.teams);
  STATE.freeAgents = [...newExpiringFA, ...generateFreeAgents()].sort((a, b) => b.ovr - a.ovr).slice(0, 60);
  STATE.staffMarket = ['OC','DC','SCOUT','TRAINER','OC','DC','SCOUT','TRAINER'].map(r => generateStaffMember(r));

  const hofMsg = retiredLegends.length ? `명예의 전당 헌액 은퇴 스타: ${retiredLegends.slice(0, 4).join(', ')}. ` : '';
  addInbox(`🎉 ${STATE.season} 새 시즌 개막! (샐러리캡 $${STATE.salaryCap.toFixed(1)}M 상향)`, '리그 사무국',
    `총 ${totalRetired}명의 선수가 은퇴하고 신인 드래프트·FA 이적이 완료되었습니다. ${hofMsg}새 시즌 샐러리캡이 $${STATE.salaryCap.toFixed(1)}M으로 인상되었습니다!`, 'Club');
  generatePreGameBriefing(); OFFICE_TAB = 'office';
  showToast(`${STATE.season} 새 시즌 개막! (은퇴 ${totalRetired}명 · 캡 $${STATE.salaryCap.toFixed(1)}M)`, 'success');
}

function startFieldAnim(fromX, toX, playType, resultText, resultColor) {

  const m = LIVE_MATCH;
  const targetIdx = (playType === 'rush') ? 6 : [7, 8, 9, 10][Math.floor(Math.random() * 4)];
  FIELD_ANIM = {
    frameId: null, t: 0, speed: FIELD_ANIM.speed || 1,
    fromX: clamp(fromX, 0, 100), toX: clamp(toX, 0, 100), playType,
    offPlay: (m && m.lastOffEngineKey) || 'Quick Slant',
    defPlay: (m && m.lastDefEngineKey) || 'Zone Coverage',
    offLabel: (m && m.lastOffPlay) || '', defLabel: (m && m.lastDefPlay) || '',
    offTeamId: (m && m.lastOffTeamId) || (m ? (m.poss===0?m.homeId:m.awayId) : null),
    defTeamId: (m && m.lastDefTeamId) || (m ? (m.poss===0?m.awayId:m.homeId) : null),
    firstDownX: (m && m.lastFirstDownX) || clamp(fromX + 10, 0, 100),
    resultText, resultColor, targetIdx, flipped: MATCH_FLIP,
    particles: playType === 'td' ? Array.from({length:38},()=>({x:0.86+Math.random()*0.13,y:0.1+Math.random()*0.8,vx:(Math.random()-0.5)*0.008,vy:(Math.random()-0.5)*0.014,size:3+Math.random()*4,color:['#f59e0b','#38bdf8','#10b981','#fff'][rand(0,3)]})) : []
  };
  const step = () => {
    FIELD_ANIM.t = Math.min(1, FIELD_ANIM.t + 0.012 * (FIELD_ANIM.speed || 1));
    drawFieldCanvas();
    if (FIELD_ANIM.t < 1) FIELD_ANIM.frameId = requestAnimationFrame(step);
    else FIELD_ANIM.frameId = null;
  };
  FIELD_ANIM.frameId = requestAnimationFrame(step);
}

function replayFieldAnim() {
  if (!LIVE_MATCH || FIELD_ANIM.playType === 'idle') return;
  if (FIELD_ANIM.frameId) cancelAnimationFrame(FIELD_ANIM.frameId);
  FIELD_ANIM.t = 0;
  const step = () => {
    FIELD_ANIM.t = Math.min(1, FIELD_ANIM.t + 0.012 * (FIELD_ANIM.speed || 1));
    drawFieldCanvas();
    if (FIELD_ANIM.t < 1) FIELD_ANIM.frameId = requestAnimationFrame(step);
    else FIELD_ANIM.frameId = null;
  };
  FIELD_ANIM.frameId = requestAnimationFrame(step);
}

function drawArrow(ctx, pts, color, dashed = false, width = 2.2) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = width;
  if (dashed) ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke(); ctx.setLineDash([]);
  const p1 = pts[pts.length - 2], p2 = pts[pts.length - 1];
  const ang = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]), len = 7;
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(p2[0], p2[1]);
  ctx.lineTo(p2[0] - len*Math.cos(ang - 0.5), p2[1] - len*Math.sin(ang - 0.5));
  ctx.lineTo(p2[0] - len*Math.cos(ang + 0.5), p2[1] - len*Math.sin(ang + 0.5));
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function drawPositionToken(ctx, x, y, fill, ring, posLabel, r, isCarrier) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.beginPath(); ctx.ellipse(x + 1, y + r * 0.8, r * 1.08, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  if (isCarrier) {
    ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(x, y, r * 1.45, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(250,204,21,0.16)'; ctx.fill();
  }
  ctx.fillStyle = fill;
  ctx.strokeStyle = ring;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  const fSize = posLabel.length >= 2 ? Math.max(7.5, Math.floor(r * 0.86)) : Math.max(8.5, Math.floor(r * 1.02));
  ctx.font = `900 ${fSize}px Inter, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(posLabel, x, y + 0.5);
  ctx.restore();
}

function drawBlockSpark(ctx, x, y, intensity, color = '#fb923c') {
  if (intensity <= 0.05) return;
  ctx.save();
  ctx.globalAlpha = clamp(intensity, 0, 1);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  const rays = 6;
  const rIn = 3, rOut = 7 + intensity * 5;
  for (let i = 0; i < rays; i++) {
    const a = (Math.PI * 2 * i) / rays + 0.4;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * rIn, y + Math.sin(a) * rIn);
    ctx.lineTo(x + Math.cos(a) * rOut, y + Math.sin(a) * rOut);
    ctx.stroke();
  }
  ctx.fillStyle = '#fef08a';
  ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawHitImpact(ctx, x, y, u, label, color) {
  if (u <= 0 || u > 1) return;
  ctx.save();
  const alpha = 1 - u * 0.85;
  // Expanding double shockwave rings
  ctx.strokeStyle = color;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(x, y, 8 + u * 26, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(x, y, 4 + u * 16, 0, Math.PI * 2); ctx.stroke();
  // Starburst impact spikes
  const spikes = 8;
  for (let i = 0; i < spikes; i++) {
    const a = (Math.PI * 2 * i) / spikes;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * (6 + u * 6), y + Math.sin(a) * (6 + u * 6));
    ctx.lineTo(x + Math.cos(a) * (13 + u * 14), y + Math.sin(a) * (13 + u * 14));
    ctx.stroke();
  }
  // Floating collision callout pill
  if (label) {
    const py = y - 18 - u * 16;
    ctx.globalAlpha = Math.min(1, (1 - u * 0.65) * 1.3);
    ctx.font = '900 10px Inter, sans-serif';
    const tw = ctx.measureText(label).width + 12;
    ctx.fillStyle = 'rgba(9,14,26,0.9)';
    ctx.beginPath(); ctx.roundRect(x - tw / 2, py - 9, tw, 18, 5); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x, py);
  }
  ctx.restore();
}

function drawFieldCanvas() {
  const canvas = document.getElementById('field-canvas');
  if (!canvas || !LIVE_MATCH) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const W = Math.max(320, Math.floor(rect.width));
  const H = W < 520 ? Math.max(220, Math.floor(W * 0.58)) : Math.max(290, Math.min(410, Math.floor(W * 0.48)));
  if (canvas.width !== W * dpr || canvas.height !== H * dpr) {
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Subtle micro-shake on heavy collision (Sack / Turnover / Big Hit)
  if (FIELD_ANIM.t < 1 && FIELD_ANIM.t > 0.66 && FIELD_ANIM.t < 0.88 && ['sack','int','rush','pass'].includes(FIELD_ANIM.playType)) {
    const mag = (FIELD_ANIM.playType === 'sack' || FIELD_ANIM.playType === 'int') ? 3.2 : 1.6;
    ctx.translate((Math.random() - 0.5) * mag * 2, (Math.random() - 0.5) * mag * 2);
  }

  const home = getTeam(LIVE_MATCH.homeId), away = getTeam(LIVE_MATCH.awayId);
  const animActive = FIELD_ANIM.t < 1;
  const offTeam = (animActive && FIELD_ANIM.offTeamId) ? getTeam(FIELD_ANIM.offTeamId) : (LIVE_MATCH.poss === 0 ? home : away);
  const defTeam = (animActive && FIELD_ANIM.defTeamId) ? getTeam(FIELD_ANIM.defTeamId) : (LIVE_MATCH.poss === 0 ? away : home);

  // Dark turf surround (like mockup 11607)
  ctx.fillStyle = '#113822';
  ctx.fillRect(0, 0, W, H);
  const padX = Math.round(W * 0.04), padY = Math.round(H * 0.08);
  const fX = padX, fY = padY, fW = W - padX * 2, fH = H - padY * 2;
  const midY = fY + fH / 2;
  const ydToX = (yd) => fX + ((yd + 10) / 120) * fW;
  const pctToY = (pct) => fY + ((pct + 50) / 100) * fH;

  // Crisp White Outer Border
  ctx.fillStyle = '#f1f5f9';
  ctx.fillRect(fX - 5, fY - 5, fW + 10, fH + 10);

  // Turf 5-yard stripes
  for (let i = 0; i < 20; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#277046' : '#2d7a4e';
    const x1 = ydToX(i * 5), x2 = ydToX((i + 1) * 5);
    ctx.fillRect(x1, fY, x2 - x1 + 1, fH);
  }

  // Team Endzones with diagonal striping (matching mockup "SURGE")
  const drawEZ = (x1, x2, tm, rot) => {
    ctx.save(); ctx.beginPath(); ctx.rect(x1, fY, x2 - x1, fH); ctx.clip();
    ctx.fillStyle = tm.color; ctx.fillRect(x1, fY, x2 - x1, fH);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 4;
    for (let s = x1 - fH; s < x2 + fH; s += 11) { ctx.beginPath(); ctx.moveTo(s, fY); ctx.lineTo(s + fH, fY + fH); ctx.stroke(); }
    ctx.fillStyle = tm.accent || '#facc15';
    ctx.font = `900 ${Math.max(13, Math.floor(fH * 0.105))}px Inter, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.translate((x1 + x2) / 2, midY); ctx.rotate(rot);
    ctx.fillText(tm.name.toUpperCase(), 0, 0);
    ctx.restore();
  };
  drawEZ(fX, ydToX(0), home, -Math.PI / 2);
  drawEZ(ydToX(100), fX + fW, home, Math.PI / 2);

  // Yellow Goalposts
  ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2.8;
  ctx.beginPath();
  ctx.moveTo(fX - 10, midY - 14); ctx.lineTo(fX - 4, midY - 8); ctx.lineTo(fX - 4, midY + 8); ctx.lineTo(fX - 10, midY + 14);
  ctx.moveTo(fX + fW + 10, midY - 14); ctx.lineTo(fX + fW + 4, midY - 8); ctx.lineTo(fX + fW + 4, midY + 8); ctx.lineTo(fX + fW + 10, midY + 14);
  ctx.stroke();

  // Midfield Team Crest Circle
  ctx.save();
  const mx = ydToX(50), mr = Math.min(24, fH * 0.11);
  ctx.fillStyle = home.color; ctx.globalAlpha = 0.72;
  ctx.beginPath(); ctx.arc(mx, midY, mr, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = home.accent; ctx.lineWidth = 2; ctx.stroke();
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = home.accent; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(mx - mr*0.55, midY); ctx.lineTo(mx - mr*0.2, midY); ctx.lineTo(mx - mr*0.05, midY - mr*0.45); ctx.lineTo(mx + mr*0.15, midY + mr*0.45); ctx.lineTo(mx + mr*0.3, midY); ctx.lineTo(mx + mr*0.55, midY); ctx.stroke();
  ctx.restore();

  // Yard lines, Hash marks & Numbers
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = `800 ${Math.max(10, Math.floor(fH * 0.055))}px JetBrains Mono, monospace`;
  ctx.textAlign = 'center';
  for (let y = 0; y <= 100; y += 5) {
    const x = ydToX(y);
    ctx.beginPath(); ctx.moveTo(x, fY); ctx.lineTo(x, fY + fH); ctx.stroke();
    if (y > 0 && y < 100 && y % 10 === 0) {
      const lbl = y <= 50 ? y : 100 - y;
      ctx.fillText(lbl, x, fY + 18);
      ctx.fillText(lbl, x, fY + fH - 10);
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.38)';
  for (let y = 1; y < 100; y++) {
    const x = ydToX(y);
    ctx.beginPath();
    ctx.moveTo(x, fY + fH * 0.36); ctx.lineTo(x, fY + fH * 0.385);
    ctx.moveTo(x, fY + fH * 0.615); ctx.lineTo(x, fY + fH * 0.64);
    ctx.stroke();
  }

  // Glowing Blue LOS & Yellow First Down Line + Orange Sideline Chain Markers
  const baseYd = animActive ? FIELD_ANIM.fromX : LIVE_MATCH.yardLine;
  const fdYd = animActive ? FIELD_ANIM.firstDownX : Math.min(100, LIVE_MATCH.yardLine + LIVE_MATCH.dist);
  const losX = ydToX(baseYd), fdX = ydToX(fdYd);

  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(losX, fY); ctx.lineTo(losX, fY + fH); ctx.stroke();
  ctx.fillStyle = '#f97316';
  ctx.beginPath(); ctx.arc(losX, fY - 3, 4, 0, Math.PI * 2); ctx.arc(losX, fY + fH + 3, 4, 0, Math.PI * 2); ctx.fill();

  if (fdYd < 100) {
    ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(fdX, fY); ctx.lineTo(fdX, fY + fH); ctx.stroke();
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.arc(fdX, fY - 3, 4, 0, Math.PI * 2); ctx.arc(fdX, fY + fH + 3, 4, 0, Math.PI * 2); ctx.fill();
  }

  // Position Labels for crisp tactical readability (replaces jersey numbers)
  const offLabels = ['OL', 'OL', 'C', 'OL', 'OL', 'QB', 'RB', 'WR', 'WR', 'WR', 'TE'];
  const defLabels = ['DL', 'DL', 'DL', 'DL', 'LB', 'LB', 'LB', 'CB', 'CB', 'S', 'S'];

  const t = FIELD_ANIM.t;
  const pt = FIELD_ANIM.playType;
  const flipSign = (animActive ? FIELD_ANIM.flipped : MATCH_FLIP) ? -1 : 1;
  const selectedOffObj = OFF_PLAYS.find(p => p.id === MATCH_SELECTED_PLAY) || OFF_PLAYS[0];
  const activeOffKey = animActive ? FIELD_ANIM.offPlay : selectedOffObj.engineKey;
  const activeDefKey = animActive ? FIELD_ANIM.defPlay : (DEF_PLAYS.find(p => p.id === MATCH_SELECTED_PLAY)?.engineKey || 'Zone Coverage');
  const gained = FIELD_ANIM.toX - FIELD_ANIM.fromX;

  const easeOut = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 2.2);
  const p1 = easeOut(t / 0.25), p2 = easeOut((t - 0.22) / 0.43), p3 = easeOut((t - 0.62) / 0.38);
  const isPass = animActive ? (['pass','inc','int','td'].includes(pt) && !['Inside Run','Outside Zone'].includes(activeOffKey)) : !['Inside Run','Outside Zone','FG','PUNT'].includes(activeOffKey);
  const isRush = animActive ? (pt === 'rush' || (pt === 'td' && ['Inside Run','Outside Zone'].includes(activeOffKey))) : ['Inside Run','Outside Zone'].includes(activeOffKey);
  const isKick = animActive ? (pt === 'fg' || pt === 'punt') : ['FG','PUNT'].includes(activeOffKey);
  const isSack = animActive && pt === 'sack';

  const offStart = [
    { dx:-1.2, dy:-11 }, { dx:-1.2, dy:-5.5 }, { dx:-0.9, dy:0 }, { dx:-1.2, dy:5.5 }, { dx:-1.2, dy:11 },
    { dx: isKick ? -7 : -3.8, dy: 0 },
    { dx: isKick ? -10.5 : -7.2, dy: isKick ? 0 : 4 * flipSign },
    { dx:-1.4, dy:-38 * flipSign }, { dx:-1.4, dy:38 * flipSign },
    { dx:-2.5, dy:-22 * flipSign }, { dx:-1.4, dy:20 * flipSign }
  ];
  const defStart = [
    { dx:1.4, dy:-10 }, { dx:1.4, dy:-3.5 }, { dx:1.4, dy:3.5 }, { dx:1.4, dy:10 },
    { dx:4.6, dy:-14 }, { dx:4.6, dy:0 }, { dx:4.6, dy:14 },
    { dx:3.4, dy:-36 * flipSign }, { dx:3.4, dy:36 * flipSign },
    { dx:12, dy:-14 * flipSign }, { dx:12, dy:14 * flipSign }
  ];

  // PRE-SNAP ROUTE PREVIEW (Matching Mockup 11607!)
  if (!animActive && MATCH_SHOW_ROUTES && !LIVE_MATCH.finished) {
    const isUserOff = offTeam.id === STATE.userTeamId;
    if (isUserOff) {
      if (isRush) {
        const rbX = ydToX(baseYd + offStart[6].dx), rbY = pctToY(offStart[6].dy);
        const endY = activeOffKey === 'Outside Zone' ? pctToY(-26 * flipSign) : pctToY(2 * flipSign);
        drawArrow(ctx, [[rbX, rbY], [ydToX(baseYd + 2), endY], [ydToX(Math.min(98, baseYd + 11)), endY]], '#f59e0b', false, 2.6);
      } else if (!isKick) {
        // Draw crisp Madden/FM pre-snap route arrows directly on the field!
        const rSpecs = [
          { idx: 7, pts: [[baseYd+5, -38*flipSign], [baseYd+13, (activeOffKey==='Quick Slant'?-22:-38)*flipSign]], col: '#38bdf8' },
          { idx: 8, pts: [[baseYd+5, 38*flipSign], [baseYd+13, (activeOffKey==='Quick Slant'?22:38)*flipSign]], col: '#38bdf8' },
          { idx: 9, pts: [[baseYd+4, -22*flipSign], [baseYd+(activeOffKey==='Deep Shot'?24:12), (activeOffKey==='Play Action'?10:-12)*flipSign]], col: '#f59e0b' },
          { idx: 10, pts: [[baseYd+4, 20*flipSign], [baseYd+10, 8*flipSign]], col: '#38bdf8' },
        ];
        rSpecs.forEach(sp => {
          const sx = ydToX(baseYd + offStart[sp.idx].dx), sy = pctToY(offStart[sp.idx].dy);
          const pts = [[sx, sy], ...sp.pts.map(([yd, py]) => [ydToX(clamp(yd, 0, 99)), pctToY(clamp(py, -45, 45))])];
          drawArrow(ctx, pts, sp.col, false, 2.2);
        });
      }
    } else {
      // Defensive coverage / blitz preview on field!
      if (activeDefKey === 'Zone Blitz' || activeDefKey === 'Run Stuff') {
        [4, 5].forEach(i => drawArrow(ctx, [[ydToX(baseYd+defStart[i].dx), pctToY(defStart[i].dy)], [ydToX(baseYd-3), midY]], '#ef4444', true, 2.2));
      } else {
        [9, 10].forEach(i => {
          ctx.save(); ctx.fillStyle = 'rgba(56,189,248,0.16)'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.ellipse(ydToX(baseYd+14), pctToY(defStart[i].dy), 28, 22, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
        });
      }
    }
  }

  // Animated 11v11 Movement
  const tgtIdx = FIELD_ANIM.targetIdx || 7;
  const routeEndY = (activeOffKey === 'Outside Zone' ? -26 : activeOffKey === 'Inside Run' ? 2 : (offStart[tgtIdx]?.dy || -20) * 0.45) * (animActive ? 1 : flipSign);

  const offPos = offStart.map((pl, idx) => {
    let yd = baseYd + pl.dx, py = pl.dy;
    if (animActive && t > 0.01) {
      if (idx <= 4) yd += (isRush ? Math.min(3.2, Math.max(-1, gained*0.2))*p2 : -1.1*p1) + Math.sin(t*28+idx)*0.22;
      else if (idx === 5) { yd += (isRush ? -2.1 : -4.0)*p1; if (isSack) yd = baseYd + gained * easeOut(t/0.7); }
      else if (idx === 6) {
        if (isRush) { yd = baseYd + pl.dx + (gained - pl.dx)*easeOut((t-0.14)/0.82); py = pl.dy + (routeEndY - pl.dy)*easeOut((t-0.12)/0.45); }
        else if (isKick) yd += 3.5*p1;
        else { yd += 2.5*p2; py += 10*p2; }
      } else {
        const isPri = idx === tgtIdx && isPass;
        const cYd = isPri ? clamp(baseYd + gained*0.72, 2, 99) : clamp(baseYd + Math.max(8, Math.min(22, Math.abs(gained)+6)), 2, 98);
        const eYd = isPri ? FIELD_ANIM.toX : clamp(cYd + 4, 2, 99);
        const eY = isPri ? routeEndY : clamp(pl.dy * 0.75, -40, 40);
        if (t <= 0.62) { const u = easeOut(t/0.62); yd = baseYd + pl.dx + (cYd - (baseYd + pl.dx))*u; py = pl.dy + (eY - pl.dy)*u; }
        else { yd = cYd + (eYd - cYd)*p3; py = eY; }
      }
    }
    return { x: ydToX(clamp(yd, -6, 106)), y: pctToY(clamp(py, -46, 46)), yd: clamp(yd, -6, 106), pos: (isKick && idx === 6) ? (activeOffKey === 'PUNT' ? 'P' : 'K') : offLabels[idx] };
  });

  const defPos = defStart.map((pl, idx) => {
    let yd = baseYd + pl.dx, py = pl.dy;
    if (animActive && t > 0.01) {
      if (idx <= 3) {
        if (isSack && idx === 1) { yd = baseYd + pl.dx + (offPos[5].yd - (baseYd + pl.dx))*easeOut(t/0.65); py = pl.dy*(1 - easeOut(t/0.65)); }
        else yd += (isRush ? Math.min(2, gained*0.2) : -1.4)*p1;
      } else if (idx <= 6) {
        const tYd = isRush ? offPos[6].yd : (baseYd + gained*0.65);
        yd += (tYd - (baseYd + pl.dx))*p2*0.72; py += ((isRush?routeEndY:pl.dy*0.65) - pl.dy)*p2*0.72;
      } else {
        const mOff = offPos[idx === 7 ? 7 : idx === 8 ? 8 : idx === 9 ? 9 : 10];
        const desYd = Math.min(102, (mOff ? mOff.yd : baseYd+12) + 2.5);
        yd = baseYd + pl.dx + (desYd - (baseYd + pl.dx))*easeOut(t/0.85);
      }
    }
    return { x: ydToX(clamp(yd, -6, 106)), y: pctToY(clamp(py, -46, 46)), pos: defLabels[idx] };
  });

  // Ball position & 3D arc
  let ballX = offPos[5].x, ballY = offPos[5].y, ballH = 0, carrier = -1;
  if (!animActive) { ballX = ydToX(baseYd); ballY = midY; }
  else if (isSack) { ballX = offPos[5].x; ballY = offPos[5].y; carrier = 5; }
  else if (isRush) {
    if (t < 0.18) { const u = t/0.18; ballX = offPos[5].x + (offPos[6].x-offPos[5].x)*u; ballY = offPos[5].y + (offPos[6].y-offPos[5].y)*u; carrier = 5; }
    else { ballX = offPos[6].x; ballY = offPos[6].y; carrier = 6; }
  } else if (isPass) {
    const tgt = offPos[tgtIdx];
    if (t < 0.28) { ballX = offPos[5].x; ballY = offPos[5].y; carrier = 5; }
    else if (t < 0.64) { const u = (t-0.28)/0.36; ballX = offPos[5].x + (tgt.x-offPos[5].x)*u; ballY = offPos[5].y + (tgt.y-offPos[5].y)*u; ballH = Math.sin(u*Math.PI)*34; }
    else { ballX = tgt.x + (pt==='inc'?8:0); ballY = tgt.y + (pt==='inc'?6:0); carrier = (pt==='inc'||pt==='int') ? -1 : tgtIdx; }
  } else if (isKick) {
    const u = easeOut((t-0.15)/0.8);
    ballX = offPos[6].x + (ydToX(FIELD_ANIM.toX) - offPos[6].x)*u;
    ballY = offPos[6].y + (midY - offPos[6].y)*u; ballH = Math.sin(u*Math.PI)*50;
  }

  // Live animated trail
  if (animActive && MATCH_SHOW_ROUTES && t > 0.2 && (isPass || isKick)) {
    ctx.save(); ctx.strokeStyle = FIELD_ANIM.resultColor; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(offPos[isKick?6:5].x, offPos[isKick?6:5].y);
    ctx.quadraticCurveTo((offPos[isKick?6:5].x+ballX)/2, (offPos[isKick?6:5].y+ballY)/2 - ballH*1.1, ballX, ballY - ballH);
    ctx.stroke(); ctx.restore();
  }

  // Converge nearest defender onto ball carrier for realistic tackle/hit contact
  if (animActive && t > 0.55 && carrier >= 0 && pt !== 'td') {
    const tacklerIdx = isSack ? 1 : isRush ? 5 : (tgtIdx === 7 ? 7 : tgtIdx === 8 ? 8 : 9);
    const uHit = easeOut((t - 0.55) / 0.25);
    const cPos = offPos[carrier];
    if (cPos && defPos[tacklerIdx]) {
      defPos[tacklerIdx].x = defPos[tacklerIdx].x + (cPos.x + 8 - defPos[tacklerIdx].x) * uHit;
      defPos[tacklerIdx].y = defPos[tacklerIdx].y + (cPos.y - defPos[tacklerIdx].y) * uHit;
    }
  }

  // Draw all 22 position-labeled tokens
  const tokR = Math.max(8, Math.min(11.5, W / 68));
  defPos.forEach(p => drawPositionToken(ctx, p.x, p.y, '#1e293b', '#f8fafc', p.pos, tokR, false));
  offPos.forEach((p, i) => drawPositionToken(ctx, p.x, p.y, offTeam.color, offTeam.accent || '#facc15', p.pos, tokR, i === carrier));

  // Trench BLOCK collision sparks (OL vs DL clash during snap/protection/run blocking!)
  if (animActive && t > 0.08 && t < 0.65 && !isKick) {
    const pulse = Math.sin(((t - 0.08) / 0.57) * Math.PI);
    for (let b = 0; b < 4; b++) {
      const o = offPos[b], d = defPos[b];
      if (!o || !d) continue;
      const distPx = Math.hypot(d.x - o.x, d.y - o.y);
      if (distPx < tokR * 3.8) {
        const sparkStrength = pulse * (0.65 + 0.35 * Math.sin(t * 36 + b * 2));
        drawBlockSpark(ctx, (o.x + d.x) / 2, (o.y + d.y) / 2, sparkStrength, isRush ? '#34d399' : '#fb923c');
      }
    }
    if (isRush && t > 0.22 && t < 0.50) {
      drawHitImpact(ctx, (offPos[2].x + defPos[1].x) / 2, (offPos[2].y + defPos[1].y) / 2, (t - 0.22) / 0.28, 'BLOCK!', '#34d399');
    }
  }

  // HIT / SACK / TACKLE / PASS BREAKUP collision visual indicator!
  if (animActive && t > 0.68 && !isKick && pt !== 'td') {
    const uCol = (t - 0.68) / 0.32;
    if (isSack) {
      drawHitImpact(ctx, offPos[5].x, offPos[5].y, uCol, '💥 SACK!', '#ef4444');
    } else if (pt === 'int') {
      drawHitImpact(ctx, ballX, ballY, uCol, '🚨 PICKED!', '#ef4444');
    } else if (pt === 'inc') {
      drawHitImpact(ctx, ballX, ballY, uCol, '✋ DEFLECTED', '#94a3b8');
    } else if (pt === 'rush' || pt === 'pass') {
      const heavy = gained <= 1;
      drawHitImpact(ctx, ballX, ballY, uCol, heavy ? '💥 BIG HIT!' : '💥 TACKLE', heavy ? '#f97316' : '#facc15');
    }
  }

  // Football + Shadow
  if (ballH > 1) {
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.beginPath(); ctx.ellipse(ballX, ballY + 4, 5.5*(1-ballH/120), 2.8*(1-ballH/120), 0, 0, Math.PI*2); ctx.fill();
  }
  const bs = 1 + ballH / 75;
  ctx.save(); ctx.translate(ballX, ballY - ballH); ctx.scale(bs, bs);
  ctx.fillStyle = '#9a3412'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 4, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#fef3c7'; ctx.beginPath(); ctx.moveTo(-2.2, 0); ctx.lineTo(2.2, 0); ctx.stroke();
  ctx.restore();

  if (animActive && pt === 'td' && FIELD_ANIM.particles.length) {
    FIELD_ANIM.particles.forEach(ptc => {
      ctx.fillStyle = ptc.color;
      ctx.fillRect((ptc.x + ptc.vx*t*18)*W, (ptc.y + ptc.vy*t*18)*H, ptc.size, ptc.size*0.65);
    });
  }

  if (animActive && FIELD_ANIM.resultText && t > 0.52) {
    ctx.save();
    const bw = Math.min(260, W * 0.55), bh = 30;
    ctx.fillStyle = 'rgba(9, 14, 26, 0.9)';
    ctx.beginPath(); ctx.roundRect(W/2 - bw/2, 10, bw, bh, 7); ctx.fill();
    ctx.strokeStyle = FIELD_ANIM.resultColor; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = FIELD_ANIM.resultColor; ctx.font = '900 13px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(FIELD_ANIM.resultText, W/2, 25);
    ctx.restore();
  }
}

function showToast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  const bg = type === 'success' ? 'bg-emerald-600 border-emerald-400' : type === 'error' ? 'bg-rose-600 border-rose-400' : 'bg-slate-800 border-sky-400';
  el.className = `${bg} border text-white text-xs sm:text-sm font-bold px-4 py-2.5 rounded-lg shadow-xl pointer-events-auto`;
  el.textContent = msg; c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2600);
}
function openModal(title, html) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  const ov = document.getElementById('modal-overlay'); ov.classList.remove('hidden'); ov.classList.add('flex');
}
function closeModal() { const ov = document.getElementById('modal-overlay'); ov.classList.add('hidden'); ov.classList.remove('flex'); }

function renderApp() {
  const root = document.getElementById('app-root');
  if (SCREEN === 'NEW_CAREER') {
    root.innerHTML = renderNewCareerScreen();
  } else if (SCREEN === 'MATCH') {
    root.innerHTML = renderMatchScreen();
    setTimeout(drawFieldCanvas, 15);
  } else {
    root.innerHTML = renderOfficeShell();
  }
}

function handleContinueBtn() {
  if (STATE.phase === 'DRAFT') { OFFICE_TAB = 'front_office'; GM_SUBTAB = 'draft'; renderApp(); return; }
  const nextG = getUserNextGame();
  if (nextG && !nextG.played) enterLiveMatch();
  else advanceWeekOrPhase();
}

function hireStaff(sid) {
  const idx = (STATE.staffMarket || []).findIndex(s => s.id === sid);
  if (idx < 0) return;
  const s = STATE.staffMarket.splice(idx, 1)[0];
  const ut = getUserTeam();
  if (ut.staff && ut.staff[s.role]) STATE.staffMarket.push(ut.staff[s.role]);
  ut.staff[s.role] = s;
  showToast(`${s.name} 코치를 ${s.role}로 선임했습니다!`, 'success');
  renderApp();
}

function selectMatchPlay(playId) {
  MATCH_SELECTED_PLAY = playId;
  renderApp();
}
function executeMatchSnap(overrideCall = null) {
  if (!LIVE_MATCH || LIVE_MATCH.finished) return;
  resolvePlay(LIVE_MATCH, overrideCall || MATCH_SELECTED_PLAY, false);
  renderApp();
}
function callCoordinatorPlay() {
  if (!LIVE_MATCH || LIVE_MATCH.finished) return;
  const isUserOff = (LIVE_MATCH.poss === 0 ? LIVE_MATCH.homeId : LIVE_MATCH.awayId) === STATE.userTeamId;
  MATCH_SELECTED_PLAY = getRecommendedPlays(LIVE_MATCH, isUserOff)[0];
  executeMatchSnap(MATCH_SELECTED_PLAY);
}
function useMatchTimeout() {
  if (!LIVE_MATCH || LIVE_MATCH.finished) return;
  const uIdx = LIVE_MATCH.homeId === STATE.userTeamId ? 0 : 1;
  if (LIVE_MATCH.timeouts[uIdx] <= 0) { showToast('남은 타임아웃이 없습니다.', 'error'); return; }
  LIVE_MATCH.timeouts[uIdx]--; SoundFX.whistle();
  LIVE_MATCH.lastBanner = `⏸️ ${getUserTeam().name} 타임아웃 (남은 횟수: ${LIVE_MATCH.timeouts[uIdx]})`;
  renderApp();
}
function stopAutoPlay() {
  MATCH_AUTO_PLAY = false;
  if (AUTO_PLAY_TIMER) { clearInterval(AUTO_PLAY_TIMER); AUTO_PLAY_TIMER = null; }
}
function toggleAutoPlay() {
  if (MATCH_AUTO_PLAY) { stopAutoPlay(); renderApp(); return; }
  MATCH_AUTO_PLAY = true; renderApp();
  AUTO_PLAY_TIMER = setInterval(() => {
    if (!LIVE_MATCH || LIVE_MATCH.finished || SCREEN !== 'MATCH') { stopAutoPlay(); renderApp(); return; }
    if (FIELD_ANIM.t >= 1) callCoordinatorPlay();
  }, 1500);
}
function simMatchToEnd() {
  stopAutoPlay();
  if (!LIVE_MATCH) return;
  let guard = 0;
  while (!LIVE_MATCH.finished && guard < 350) { resolvePlay(LIVE_MATCH, null, false); guard++; }
  renderApp();
}
